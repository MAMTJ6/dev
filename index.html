<!DOCTYPE html>
<html lang="ms" class="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MULTIMEDIA MAMTJ6</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/media/logo-mamtj6/SVG/mamtj6_single.svg" />
  <!-- Open Graph Meta Tags (for Facebook, LinkedIn, etc.) -->
  <meta property="og:title" content="MULTIMEDIA MAMTJ6" />
  <meta property="og:description" content="Info tentang projek multimedia yang dibangunkan untuk kegunaan umum" />
  <meta property="og:image" content="https://dev.mamtj6.com/media/web/linkpreview.jpg" />
  <meta property="og:url" content="https://dev.mamtj6.com" />
  <meta property="og:type" content="website" />
  <!-- Twitter Card (for Twitter link preview) -->
  <meta name="twitter:card" content="MULTIMEDIA MAMTJ6" />
  <meta name="twitter:title" content="MULTIMEDIA MAMTJ6" />
  <meta name="twitter:description" content="Info tentang projek multimedia yang dibangunkan untuk kegunaan MAMTJ6" />
  <meta name="twitter:image" content="https://dev.mamtj6.com/media/web/linkpreview.jpg" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Elak kelipan (flash) semasa muat halaman -->
  <script>
      (function () {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.replace('light', 'dark');
        }
      })();
  </script>

  <!-- Custom keyframes not covered by Tailwind utilities -->
  <style>
    @keyframes slideUp {
      from {
        transform: translate(-50%, 100%);
        opacity: 0;
      }

      to {
        transform: translate(-50%, -50%);
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    .notification {
      animation: slideUp 0.5s ease-out;
    }

    .notification.fade-out {
      animation: fadeOut 0.5s ease-out forwards;
    }
  </style>
</head>

<body
  class="bg-zinc-50 dark:bg-zinc-950 text-zinc-950 dark:text-zinc-50 font-sans antialiased transition-colors duration-300">
  <div class="max-w-4xl mx-auto px-4 py-8 sm:px-6">

    <!-- Butang Tema -->
    <div class="flex justify-end mb-4">
      <button id="theme-toggle"
        class="inline-flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-2 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors"
        aria-label="Tukar tema">
        <svg id="icon-sun" class="hidden dark:block h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
        <svg id="icon-moon" class="block dark:hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
      </button>
    </div>

    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img src="/media/logo-mamtj6/SVG/mamtj6-black_text.svg" alt="Logo MAMTJ6" class="h-16 w-auto block dark:hidden">
      <img src="/media/logo-mamtj6/SVG/mamtj6_white_text.svg" alt="Logo MAMTJ6" class="h-16 w-auto hidden dark:block">
    </div>

    <!-- Tajuk -->
    <div class="text-center mb-8">
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100 uppercase">
        Projek Multimedia MAMTJ6
      </h1>
      <p class="text-sm sm:text-base text-zinc-500 dark:text-zinc-400 mt-1">
        Info tentang projek multimedia yang dibangunkan untuk kegunaan MAMTJ6
      </p>
      <div class="flex justify-center gap-3 mt-4">
        <a href="https://mamtj6.com"
          class="inline-flex items-center rounded-full px-4 py-2 text-sm font-semibold bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">Website
          MAMTJ6</a>
        <a href="https://github.com/multimedia-mamtj6/multimedia-mamtj6"
          class="inline-flex items-center rounded-full px-4 py-2 text-sm font-semibold border border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">Github
          repositories</a>
      </div>
    </div>

    <!-- Grid Kategori -->
    <h2 class="text-center text-sm font-semibold text-zinc-500 dark:text-zinc-400 mb-4">
      Sila tekan kategori di bawah untuk melihat item yang berkaitan
    </h2>
    <div id="category-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      <p class="col-span-full text-center text-zinc-400 py-10">Memuatkan...</p>
    </div>
  </div>

  <!-- Popup Kategori -->
  <div id="modal-overlay"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div id="modal-panel"
      class="relative w-full max-w-md max-h-[85vh] overflow-y-auto rounded-2xl bg-white dark:bg-zinc-900 shadow-2xl p-6 sm:p-8">
      <button id="modal-close" aria-label="Tutup"
        class="absolute top-3 right-3 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition-colors">
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>

      <h3 id="modal-title" class="text-lg font-bold text-zinc-900 dark:text-zinc-100 mb-4 pr-6"></h3>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer
    class="mt-auto text-center py-6 border-t border-zinc-200 dark:border-zinc-800 text-zinc-500 dark:text-zinc-400">
    <p class="text-sm">&copy; 2025-2026 MAMTJ6. All rights reserved. |
      <a href="https://mamtj6.com" class="text-emerald-600 dark:text-emerald-400 hover:underline">mamtj6.com</a>
    </p>
    <p class="text-sm mt-1">Last updated: <strong id="last-updated"
        class="font-semibold text-zinc-700 dark:text-zinc-200">12 September, 2025</strong></p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Tema
      const themeToggle = document.getElementById('theme-toggle');
      themeToggle.addEventListener('click', function () {
        const isDark = document.documentElement.classList.toggle('dark');
        document.documentElement.classList.toggle('light', !isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });

      // Data kategori (sama seperti popup asal, hanya rekaan visual berubah)
      const categories = [
        {
          title: '1. Infaq dan paparan tabung',
          alpha: [
            { href: 'https://infaq.mamtj6.com/', label: 'Laman Utama Infaq Center' },
            { href: 'https://infaq.mamtj6.com/display/data-infaq-pembangunan.html', label: 'Paparan Tabung Pembangunan' },
            { href: 'https://infaq.mamtj6.com/display/data-tabung-bulanan.html', label: 'Paparan Tabung Bulanan' },
          ],
          beta: [],
        },
        {
          title: '2. Info kalendar Hijrah',
          alpha: [
            { href: 'https://dev.mamtj6.com/calendar/hijri/widgets/widgets.html', label: 'Repository Kalendar Hijrah' },
            { href: 'calendar/hijri/hari-ini/index.html', label: 'Tarikh Hari Ini' },
            { href: 'calendar/hijri/tarikh-penting/index.html', label: 'Tarikh Penting dalam Hijrah' },
            { href: 'calendar/hijri/widgets/widgets.html', label: 'Widget Countdown' },
          ],
          beta: [],
        },
        {
          title: '3. Sistem Jadual Kuliah',
          alpha: [
            { href: 'kuliah/index.html', label: 'Sistem Jadual dan Info Kuliah' },
            { href: 'https://www.mamtj6.com/kuliah/info', label: 'Info Kuliah MAMTJ6' },
          ],
          beta: [],
        },
        {
          title: '4. Waktu Solat',
          alpha: [
            { href: 'https://dev.mamtj6.com/waktu-solat', label: 'Waktu Solat' },
            { href: 'https://dev.mamtj6.com/waktu-solat/widget.html', label: 'Waktu Solat (Widget & Display)' },
          ],
          beta: [],
        },
        {
          title: '5. Ramadan',
          alpha: [
            { href: 'https://t.me/Islamic_countdown', label: 'Telegram Reminder' },
          ],
          beta: [],
        },
        {
          title: '6. Projek Umum (CSR)',
          alpha: [
            { href: 'csr/calc/kalkulator-budi95.html', label: 'kalkulator-budi95' },
            { href: 'https://dev.mamtj6.com/csr/zikir-harian/public.html', label: 'Zikir Harian' },
            {
              label: 'Asma-Ul-Husna', children: [
                { href: 'https://dev.mamtj6.com/csr/asma-ul-husna/index.html', label: 'Asma-Ul-Husna Senarai' },
                { href: 'https://dev.mamtj6.com/csr/asma-ul-husna/today/index.html', label: 'Asma-Ul-Husna Harian' },
              ]
            },
          ],
          beta: [],
        },
        {
          title: '7. Sistem Admin MAMTJ6',
          alpha: [
            { href: 'admin/index.html', label: 'Log Masuk' },
          ],
          beta: [],
        },
      ];

      const grid = document.getElementById('category-grid');
      const overlay = document.getElementById('modal-overlay');
      const modalTitle = document.getElementById('modal-title');
      const modalBody = document.getElementById('modal-body');
      const closeBtn = document.getElementById('modal-close');

      function renderLinkItem(item) {
        if (item.children && item.children.length) {
          const childrenHtml = item.children.map(function (c) {
            return '<a href="' + c.href + '" class="inline-block w-4/5 rounded-lg px-3 py-1.5 text-xs font-medium text-center bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">' + c.label + '</a>';
          }).join('');
          return '<div class="submenu">' +
            '<button type="button" class="submenu-toggle w-full flex items-center justify-center gap-1.5 rounded-lg px-4 py-2.5 text-sm font-medium text-center bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">' +
            '<span>' + item.label + '</span>' +
            '<svg class="submenu-chevron h-4 w-4 transition-transform" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>' +
            '</button>' +
            '<div class="submenu-children hidden mt-2 flex flex-col items-center gap-2">' + childrenHtml + '</div>' +
            '</div>';
        }
        return '<a href="' + item.href + '" class="block rounded-lg px-4 py-2.5 text-sm font-medium text-center bg-emerald-600 text-white hover:bg-emerald-700 transition-colors">' + item.label + '</a>';
      }

      function linkGroupHtml(label, links) {
        let html = '<div class="text-xs font-semibold text-zinc-400 dark:text-zinc-500 uppercase tracking-wide mb-2">' + label + '</div>';
        if (links.length === 0) {
          html += '<p class="text-sm text-zinc-400 mb-4">-</p>';
          return html;
        }
        html += '<div class="space-y-2 mb-4">' + links.map(renderLinkItem).join('') + '</div>';
        return html;
      }

      function renderGrid() {
        grid.innerHTML = categories.map(function (cat, i) {
          return '<button type="button" data-index="' + i + '" class="category-card rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-4 hover:shadow-md hover:-translate-y-0.5 transition text-center flex items-center justify-center min-h-[84px]">' +
            '<span class="text-sm font-semibold text-zinc-700 dark:text-zinc-200">' + cat.title + '</span>' +
            '</button>';
        }).join('');

        grid.querySelectorAll('.category-card').forEach(function (card) {
          card.addEventListener('click', function () {
            openModal(parseInt(card.dataset.index, 10));
          });
        });
      }

      function openModal(index) {
        const cat = categories[index];
        if (!cat) return;

        modalTitle.textContent = cat.title;
        modalBody.innerHTML = linkGroupHtml('Alpha', cat.alpha) + linkGroupHtml('Beta', cat.beta);

        modalBody.querySelectorAll('.submenu-toggle').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const wrapper = btn.closest('.submenu');
            wrapper.querySelector('.submenu-children').classList.toggle('hidden');
            wrapper.querySelector('.submenu-chevron').classList.toggle('rotate-180');
          });
        });

        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        document.body.classList.add('overflow-hidden');
      }

      function closeModal() {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        document.body.classList.remove('overflow-hidden');
      }

      closeBtn.addEventListener('click', closeModal);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

      renderGrid();

      // Last Updated Footer (from GitHub commit history for index.html)
      fetch("https://api.github.com/repos/multimedia-mamtj6/dev/commits?path=index.html&page=1&per_page=1")
        .then((res) => res.json())
        .then((data) => {
          const dateStr = data[0]?.commit?.committer?.date;
          if (!dateStr) return;
          const formatted = new Date(dateStr).toLocaleDateString("ms-MY", {
            day: "numeric",
            month: "long",
            year: "numeric",
          });
          document.getElementById("last-updated").textContent = formatted;
        })
        .catch(() => {
          // Keep static fallback date on failure
        });

    });
  </script>
</body>

</html>
