          // Simplest fix that avoids both failure modes: never create a tile
          // layer at the wrong zoom in the first place. There is nothing
          // useful to show under a still-loading district layer anyway (no
          // polygons, no labels, just bare tiles), so waiting costs nothing.
          //
          // MUST be registered BEFORE resetMapView() runs, not after — this
          // was the actual live bug (confirmed via user report: map stayed
          // permanently blank until manually zooming). Leaflet only animates
          // a view change (async 'moveend', ~250ms later) for a SMALL zoom
          // delta, like Pahang's hand-tuned view re-applying the identical
          // provisional one. A LARGE jump — exactly the auto-fitBounds()
          // case this comment opened with — skips the animation and resolves
          // synchronously, firing 'moveend' immediately, inside the
          // resetMapView() call itself. Registering the listener AFTER that
          // call therefore missed the event outright; since .once() only
          // unregisters after actually firing, the dangling listener stayed
          // armed and silently caught the NEXT 'moveend' instead — whatever
          // interaction (e.g. the user manually zooming) happened to
          // trigger one. Registering first makes this correct regardless of
          // which path Leaflet takes.
          map.once('moveend', initTileLayer);
          resetMapView();

          applyNationwideLabelMode(); // covers the case where the initial fitBounds view already sits above the threshold
          declutterDistrictLabels(); // hide piled-up labels in dense states (Sarawak/Sabah) at state zoom
          refreshWarnings(); // initial load — map is already visible by now

          const preselect = new URLSearchParams(window.location.search).get('district');
          if (preselect && cfg.districts.includes(preselect)) {
            document.getElementById('districtSelect').value = preselect;
            highlightByName(preselect);
          }
        })
        .catch(err => {
          console.warn('[weather] Failed to load district map:', err.message);
          const mapDiv = document.getElementById('map');
          mapDiv.classList.add('flex', 'items-center', 'justify-center', 'text-center', 'px-8', 'text-lg', 'text-zinc-500', 'dark:text-zinc-400');
          mapDiv.textContent = 'Peta tidak dapat dimuatkan. Sila cuba muat semula halaman.';
        });
    }

    // Keeps ?district= in the address bar in sync with the current
    // selection — replaceState (not pushState) so flipping between
    // districts doesn't spam browser history, it just makes the current
    // URL shareable/bookmarkable as-is.
    function syncDistrictParam(name) {
      const params = new URLSearchParams(window.location.search);
      if (name) {
        params.set('district', name);
      } else {
        params.delete('district');
      }
      const query = params.toString();
      const newUrl = window.location.pathname + (query ? `?${query}` : '') + window.location.hash;
      history.replaceState(null, '', newUrl);
    }

    // In-page state switching — replaces the old full-reload navigation.
    // Swaps only the visible district features from the cached nationwide
    // GeoJSON, glides with flyTo, and refetches warnings for the new cfg.
    // The URL still syncs via replaceState so the view stays
    // shareable/bookmarkable.
    function switchState(key) {
      const next = STATE_CONFIG[key];
      if (!next) return;
      if (next === cfg) { document.getElementById('stateSelect').value = key; return; }
      cfg = next;
      activeStateKey = key;
      isNationwide = !cfg.stateCode;

      const params = new URLSearchParams(window.location.search);
      params.set('state', key);
      params.delete('district'); // districts don't carry over between states
      history.replaceState(null, '', window.location.pathname + '?' + params.toString() + window.location.hash);

      document.title = `Cuaca ${cfg.displayName} — Amaran & Peta Daerah`;
      document.getElementById('page-heading').textContent = `Cuaca ${cfg.displayName}`;
      document.getElementById('page-footer').hidden = isNationwide;
      document.getElementById('stateSelect').value = key;

      // Drop the old state's selection and stale warning paint before the
      // fresh fetch lands — same empty-first pattern as boot.
      focusDistrict = null;
      forecastToday = null;
      clearSelectionHalo();
      populateDistrictSelect();
      warningDistricts = new Map();
      warningOverlap = new Set();
      warningScope = null;
      warningStateTier = null;
      nationwideDistrictTiers = new Map();
      nationwideOverlap = new Set();
      nationwideStateWash = new Map();
      nationwidePerState = new Map();
      nationwideActiveWarnings = [];
      activeWarnings = [];
      renderForecast();
      updateSheetHandleText();
      repaintMap();
      renderCards();
      renderNationwidePanel();

      // Boot fetch still in flight — its resolve reads the new
      // cfg/isNationwide globals, so it lands on the right state without
      // further work here.
      if (!fullGeoData || !geojsonLayer) return;

      map.removeLayer(geojsonLayer);
      geojsonLayer = buildDistrictLayer(isNationwide ? fullGeoData.features : fullGeoData.features.filter(f => f.properties.state === cfg.stateCode));
      geojsonLayer.addTo(map);

      if (isNationwide && !stateBoundaryLayer) {
        buildStateBoundaryLayer().then(layer => {
          stateBoundaryLayer = layer;
          if (layer && isNationwide) layer.addTo(map);
        });
      }
      if (!isNationwide && stateBoundaryLayer) {
        map.removeLayer(stateBoundaryLayer);
        stateBoundaryLayer = null;
      }

      applyNationwideLabelMode();
      restyleStateBoundary();
      flyToStateView();
      refreshWarnings();
    }

    /**
     * Single entry point for "district selection changed" — drives both
     * the map highlight/zoom and the forecast card. Called from the
     * district select's change handler and the boot-time ?district=
     * preselect.
     */
    function highlightByName(name) {
      focusDistrict = name || null;
      syncDistrictParam(focusDistrict);
      forecastToday = null;
      renderForecast(); // placeholder / new name immediately, no stale data flash
      // Refreshes #sheet-handle-text immediately against whatever
      // activeWarnings already holds — renderCards() (called from
      // refreshWarnings()) will refine it again once new data arrives,
      // but the peek text must not wait for that to reflect the pick.
      updateSheetHandleText();
      if (focusDistrict) {
        refreshForecast();
      }

      if (!name) {
        clearSelectionHalo();
        repaintMap();
        resetMapView();
        return;
      }

      geojsonLayer.eachLayer(function (layer) {
        if (layer.feature.properties.name === name) {
          clearSelectionHalo();
          selectionHaloLayer = L.geoJSON(layer.feature, { style: SELECTION_HALO_STYLE }).addTo(map);
          geojsonLayer.resetStyle(layer);
          layer.bringToFront();
          // Adaptive mobile framing — a small district expands the sheet
          // and frames into the visible strip (focusFrameOptions()); a
          // big district would only squeeze into an overview sliver
          // there, so the sheet collapses to peek and the district takes
          // the full viewport instead (see districtNeedsFullView()).
          // maxZoom caps tiny districts so they frame instead of diving
          // to street level.
          if (isMobileViewport() && districtNeedsFullView(layer.getBounds())) {
            setSheetExpanded(false);
            map.fitBounds(layer.getBounds(), { padding: [24, 24], maxZoom: 11 });
          } else {
            // A district pick is the clearest possible "I want to see
            // this" signal — reveal the sheet on mobile rather than
            // leaving the viewer to notice/tap the peek handle themselves.
            if (isMobileViewport()) setSheetExpanded(true);
            map.fitBounds(layer.getBounds(), focusFrameOptions());
          }
        } else {
          geojsonLayer.resetStyle(layer);
        }
      });
    }

    // Populates #districtSelect from cfg.districts — re-run on every state
    // switch (choosing a state no longer reloads, see switchState()).
    // onchange assignment (not addEventListener) so re-populating can't
    // double-bind the handler.
    function populateDistrictSelect() {
      const sel = document.getElementById('districtSelect');
      sel.innerHTML = '<option value="">-- Pilih Daerah --</option>' +
        cfg.districts.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
      // Nationwide mode (cfg.districts === []) has no single district to
      // jump to — disable rather than leave an active-looking select with
      // only the placeholder option.
      sel.disabled = cfg.districts.length === 0;
      sel.onchange = () => highlightByName(sel.value);
    }

    // Populates #stateSelect from STATE_CONFIG once, at boot. Choosing a
    // state switches in place via switchState() (fly animation, no reload);
    // the URL still syncs so the view stays shareable/bookmarkable.
    function populateStateSelect(activeKey) {
      const sel = document.getElementById('stateSelect');
      sel.innerHTML = Object.entries(STATE_CONFIG)
        .map(([key, s]) => `<option value="${escapeHtml(key)}"${key === activeKey ? ' selected' : ''}>${escapeHtml(s.displayName)}</option>`)
        .join('');
      sel.addEventListener('change', () => switchState(sel.value));
    }

    // =========================================================
    // Warning cards — two FIXED cards, one per source.
    // =========================================================
    function newestFirst(list) {
      return list.slice().sort((a, b) =>
        new Date(b.warning_issue?.issued || 0) - new Date(a.warning_issue?.issued || 0));
    }

    // 'amaran' (thunderstorm/rain-lebat, untiered) reads as "Ribut Petir /
    // Hujan Lebat" in the UI, matching the card title and legend — the
    // raw TIER_LABEL value ("Amaran") is too generic on its own here.
    function tierRowLabel(tier) {
      return tier === 'amaran' ? 'Ribut Petir / Hujan Lebat' : (TIER_LABEL[tier] || tier);
    }

    function relPast(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const mins = Math.floor((Date.now() - d.getTime()) / 60000);
      if (mins < 1) return 'Sebentar tadi';
      if (mins < 60) return `${mins} minit lepas`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h} jam ${m} minit lepas` : `${h} jam lepas`;
    }

    function relFuture(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const mins = Math.floor((d.getTime() - Date.now()) / 60000);
      if (mins < 0) return 'Tamat tempoh';
      if (mins < 1) return 'Kurang 1 minit lagi';
      if (mins < 60) return `${mins} minit lagi`;
      const h = Math.floor(mins / 60), m = mins % 60;
      return m ? `${h} jam ${m} minit lagi` : `${h} jam lagi`;
    }

    function formatTimeShort(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', hour12: true }).replace('PG', 'AM').replace('PTG', 'PM');
    }

    const WARN_CARD_BASE = 'rounded-xl border border-zinc-200 dark:border-zinc-700 border-l-8 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md shadow-lg p-4 shrink-0';

    function renderWarnCard(el, title, items) {
      if (!items.length) {
        el.className = WARN_CARD_BASE + ' opacity-60';
        el.style.borderLeftColor = 'transparent';
        el.innerHTML = `
          <div class="flex items-baseline gap-2.5 pb-2 border-b border-zinc-200 dark:border-zinc-700">
            <h2 class="font-display font-bold text-base text-zinc-900 dark:text-zinc-100 m-0">Tiada ${escapeHtml(title)}</h2>
          </div>`;
        return;
      }

      const w = items[0];
      const parsed = stateScopeOf(w, cfg);
      // Highest tier among this warning's districts drives the accent colour.
      let accentTier = parsed.tier || 'amaran';
      Object.values(parsed.tiers || {}).forEach(t => {
        if (TIER_RANK[t] > TIER_RANK[accentTier]) accentTier = t;
      });

      // One pill per district, coloured by its severity tier — the
      // bulletin's full text is deliberately NOT shown: MET publishes one
      // nationwide bulletin listing every state, which is noise here.
      const pill = (label, tier) => {
        const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
        const textColor = tier === 'waspada' ? '#713f12' : '#ffffff';
        return `<span class="inline-block rounded-full px-3 py-1 text-sm font-bold shadow-sm whitespace-nowrap" style="background:${c.fill};color:${textColor}">${escapeHtml(label)}</span>`;
      };

      // Group districts by tier so each severity gets its own row — MET's
      // bulletins only ever carry ONE valid_to per bulletin, so every row
      // below intentionally reuses the same warning-level "sehingga" value.
      let rowsHtml = '';
      if (parsed.scope !== 'marine') {
        const groups = new Map(); // tier -> [district label, ...]
        if (parsed.scope === 'state') {
          groups.set(accentTier, [`Seluruh ${cfg.displayName}`]);
        } else {
          parsed.districts.forEach(d => {
            const t = (parsed.tiers && parsed.tiers[d]) || 'amaran';
            if (!groups.has(t)) groups.set(t, []);
            groups.get(t).push(d);
          });
        }
        const tiersSorted = [...groups.keys()].sort((a, b) => TIER_RANK[b] - TIER_RANK[a]);
        const sehinggaShort = w.valid_to ? (formatTimeShort(w.valid_to) || '—') : '—';
        const sehinggaRel = w.valid_to ? (relFuture(w.valid_to) || '') : '';
        rowsHtml = tiersSorted.map(tier => {
          const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
          const districtsHtml = groups.get(tier).slice().sort((a, b) => a.localeCompare(b))
            .map(d => pill(d, tier)).join('');
          return `
            <div class="py-2 border-t border-zinc-200 dark:border-zinc-700 first:border-t-0 first:pt-0">
              <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded shrink-0" style="background:${c.fill}"></span>
                <span class="text-base font-semibold text-zinc-900 dark:text-zinc-100">${escapeHtml(tierRowLabel(tier))}</span>
              </div>
              <div class="text-sm text-zinc-500 dark:text-zinc-400 mt-0.5 mb-1.5">sehingga ${escapeHtml(sehinggaShort)}${sehinggaRel ? ` · <span class="font-semibold text-zinc-900 dark:text-zinc-100">${escapeHtml(sehinggaRel)}</span>` : ''}</div>
              <div class="flex flex-wrap gap-2">${districtsHtml}</div>
            </div>`;
        }).join('');
      }

      const issued = w.warning_issue?.issued;
      const issuedShort = issued ? (formatTimeShort(issued) || '—') : '—';
      const issuedRel = issued ? (relPast(issued) || '') : '';
      const more = items.length > 1 ? `+${items.length - 1} lagi` : '';

      el.className = WARN_CARD_BASE + (accentTier === 'bahaya' ? ' tier-bahaya-active' : '');
      el.style.borderLeftColor = (TIER_COLORS[accentTier] || TIER_COLORS.amaran).fill;
      el.innerHTML = `
        <div class="pb-2 border-b border-zinc-200 dark:border-zinc-700 mb-1">
          <div class="flex items-center gap-2">
            ${accentTier === 'bahaya' ? '<span class="pulse-dot shrink-0"></span>' : ''}
            <h2 class="font-display font-bold text-lg text-zinc-900 dark:text-zinc-100 m-0">${escapeHtml(title)}</h2>
            ${more ? `<span class="text-sm font-semibold text-zinc-500 dark:text-zinc-400 whitespace-nowrap">${escapeHtml(more)}</span>` : ''}
          </div>
          <div class="text-sm font-medium text-zinc-500 dark:text-zinc-400 mt-0.5">Dikeluarkan ${escapeHtml(issuedShort)}${issuedRel ? ` · <span class="font-semibold text-zinc-900 dark:text-zinc-100">${escapeHtml(issuedRel)}</span>` : ''}</div>
        </div>
        ${rowsHtml}`;
    }

    function renderCards() {
      const thunderCard = document.getElementById('card-thunder');
      const rainCard = document.getElementById('card-rain');

      // Nationwide mode has no single cfg to scope stateScopeOf()/pill
      // wording against (cfg.apiName is null — calling into it here would
      // throw) — the coloured map + the plain-text summary panel already
      // communicate where warnings are; these two per-state cards stay
      // hidden until a real state is picked from the Negeri select.
      if (isNationwide) {
        thunderCard.hidden = true;
        rainCard.hidden = true;
        return;
      }

      const rain = newestFirst(activeWarnings.filter(w => w.source === 'rain'));
      const others = newestFirst(activeWarnings.filter(w => w.source !== 'rain'));
      // Land warnings only — marine-only bulletins (scope 'marine') and
      // bulletins that don't actually concern this state at all (scope
      // null, e.g. a Tropical Storm Advisory that merely names the state
      // as a distance reference — see extractStateDistricts()'s "state of
      // X"/"negeri X" guard) are both excluded. Marine activity is no
      // longer surfaced on these cards at all — this page is land-district
      // focused (the map/legend only ever colours land polygons).
      const land = others.filter(w => {
        const scope = stateScopeOf(w, cfg).scope;
        return scope && scope !== 'marine';
      });

      // Thunder card: ALWAYS visible, even with zero active warnings —
      // renderWarnCard's empty branch shows "Tiada Ribut Petir / Hujan Lebat".
      thunderCard.hidden = false;
      renderWarnCard(thunderCard, 'Ribut Petir / Hujan Lebat', land);

      // Rain card: hide the WHOLE card (not an empty placeholder) when
      // there's nothing to show — unlike the thunder card above.
      if (rain.length === 0) {
        rainCard.hidden = true;
      } else {
        rainCard.hidden = false;
        renderWarnCard(rainCard, 'Amaran Hujan Berterusan', rain);
      }

      updateSheetHandleText();
      fitSideColumnToViewport();
    }

    // =========================================================
    // Nationwide bottom warning bar — one flowing bulletin-style block per
    // warning type (thunderstorm / continuous rain), reusing MET's own
    // Malay bulletin wording almost verbatim instead of reconstructing a
    // state-by-state summary — real bulletins already read as one sentence
    // spanning every affected state (confirmed live, 2026-08-22:
    // "Ribut petir, hujan lebat dan angin kencang dijangka di negeri
    // Terengganu (Besut, Setiu, Kuala Nerus dan Kuala Terengganu) •
    // Sarawak: Kapit (Bukit Mabong dan Belaga)... sehingga 1:00 Pagi;
    // Ahad, 23 Ogos 2026."), so this just slices out the state/district
    // list and re-renders MET's own header ("sehingga ...") from
    // `valid_to` instead of parsing it back out of the sentence.
    // =========================================================

    // Slices "<preamble> di negeri <BODY> sehingga <time>; <date>." down
    // to just <BODY> — the state/district list is the only part worth
    // showing since the header row already carries the warning type and
    // the "sehingga" time separately.
    function extractBulletinBody(textBm) {
      const startMatch = textBm.match(/\bdi (?:negeri|kawasan)\s+/i);
      const body = startMatch ? textBm.slice(startMatch.index + startMatch[0].length) : textBm;
      return body.replace(/\s*sehingga\s+[\s\S]*$/i, '').trim();
    }

    // Lazily built once STATE_CONFIG is loaded — bolds any real state's
    // displayName wherever it appears in the (already-escaped) body text,
    // including the "W.P. " prefix MET uses for federal territories
    // ("W.P. Labuan" — without this only "Labuan" would bold, leaving a
    // plain "W.P. " in front of it, unlike every other state).
    // Best-effort only: text_bm uses each state's own Malay name, which for
    // Penang/Melaka may not exactly equal states.json's `displayName` (see
    // the English-text spelling landmine already documented in
    // weather-core.js's extractStateDistricts) — worst case those two
    // states just don't get bolded, the text itself is unaffected.
    let stateNameBoldRe = null;
    function boldStateNames(escapedBody) {
      if (!stateNameBoldRe) {
        const names = Object.values(STATE_CONFIG).map(s => s.displayName).filter(Boolean)
          .sort((a, b) => b.length - a.length).map(escapeRegExp);
        stateNameBoldRe = new RegExp('\\b((?:W\\.P\\.\\s+)?(?:' + names.join('|') + '))\\b', 'g');
      }
      // Bold only OUTSIDE parenthetical district lists — a state name can
      // legitimately reappear inside its own list (e.g. "Kuala Selangor"
      // inside Selangor's "(Klang, ... dan Kuala Selangor)"), and that
      // inner occurrence must stay plain, not get bolded as if it were
      // another state reference. split() with a capturing regex puts the
      // "(...)" matches at odd indices, the text between them at even ones.
      return escapedBody.split(/(\([^)]*\))/).map((part, i) =>
        i % 2 === 0 ? part.replace(stateNameBoldRe, '<strong>$1</strong>') : part
      ).join('');
    }

    // A warning's raw text can also be a marine-only bulletin ("perairan
    // ...") that happens to mention a state name in passing — excluded the
    // same way computeWarningStateNationwide() already excludes it from
    // the map (scope 'marine'/null), so it never appears as a false
    // "Ribut Petir" block here.
    function warningHasLandScope(w, stateCfgs) {
      return stateCfgs.some(cfg => {
        const parsed = w.source === 'rain' ? parseRainForState(w.text_en || w.text_bm, cfg) : extractStateDistricts(w, cfg);
        return parsed.scope && parsed.scope !== 'marine';
      });
    }

    // Highest tier across every real state this group of warnings touches
    // — drives the block's left accent colour. Thunderstorm ('amaran')
    // warnings are always untiered so this just confirms 'amaran'; rain
    // warnings can carry real waspada/buruk/bahaya tiers per SECTION.
    function dominantTier(group, stateCfgs) {
      let tier = 'amaran';
      group.forEach(w => {
        stateCfgs.forEach(cfg => {
          const parsed = w.source === 'rain' ? parseRainForState(w.text_en || w.text_bm, cfg) : extractStateDistricts(w, cfg);
          if (parsed.tier && TIER_RANK[parsed.tier] > TIER_RANK[tier]) tier = parsed.tier;
          Object.values(parsed.tiers || {}).forEach(t => { if (TIER_RANK[t] > TIER_RANK[tier]) tier = t; });
        });
      });
      return tier;
    }

    function renderNationwidePanel() {
      const bar = document.getElementById('nationwide-summary-bar');
      const list = document.getElementById('nationwide-summary-list');
      const countChip = document.getElementById('nationwide-summary-count');
      if (!isNationwide) { bar.hidden = true; return; }
      bar.hidden = false;

      const stateCfgs = Object.values(STATE_CONFIG).filter(s => s.apiName && s.stateCode);
      const relevant = nationwideActiveWarnings.filter(w => warningHasLandScope(w, stateCfgs));
      const groups = [
        { label: 'Ribut Petir / Hujan Lebat', items: relevant.filter(w => w.source !== 'rain') },
        { label: 'Hujan Berterusan', items: relevant.filter(w => w.source === 'rain') },
      ].filter(g => g.items.length);

      list.innerHTML = groups.length
        ? groups.map(g => {
            const tier = dominantTier(g.items, stateCfgs);
            const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
            const w = g.items[0]; // MET issues one active bulletin per category at a time — g.items may still hold several duplicate rows of THAT bulletin (see resolveDuplicateBulletins), one per numbered item within it
            // A combined bulletin lists several states/areas as "1) ... 2)
            // ... 3) ...", each with its own expiry — split it so every
            // item gets its own line instead of one row silently dropping
            // everything after the first item (see splitBulletinItems()).
            const itemsHtml = splitBulletinItems(w.text_bm || w.text_en || '').map(part => {
              const row = pickRowForSegment(g.items, part);
              const sehingga = row.valid_to
                ? `${new Date(row.valid_to).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }).replace('PG', 'AM').replace('PTG', 'PM')}, ${new Date(row.valid_to).toLocaleDateString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric' })}`
                : '—';
              const body = boldStateNames(escapeHtml(extractBulletinBody(part)));
              return `
                <div class="nationwide-warn-row flex items-baseline gap-2 mt-1">
                  <p class="leading-relaxed">${body}</p>
                  <span class="ml-auto text-xs font-semibold text-zinc-500 dark:text-zinc-400 whitespace-nowrap">sehingga ${escapeHtml(sehingga)}</span>
                </div>`;
            }).join('');
            return `
              <li class="py-2 border-t border-zinc-100 dark:border-zinc-800 first:border-t-0 first:pt-0">
                <div class="flex items-baseline gap-2">
                  <span class="w-3 h-3 rounded shrink-0" style="background:${c.fill}"></span>
                  <span class="font-semibold text-zinc-900 dark:text-zinc-100">${escapeHtml(g.label)}</span>
                </div>
                ${itemsHtml}
              </li>`;
          }).join('')
        : '<li class="py-1">Tiada amaran aktif di seluruh Malaysia</li>';

      countChip.hidden = nationwidePerState.size === 0;
      countChip.textContent = nationwidePerState.size;
    }

    function updateFooter() {
      const timeText = lastCheckedAt
        ? lastCheckedAt.toLocaleString('ms-MY', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).replace('PG', 'AM').replace('PTG', 'PM')
        : '—';
      const text = `Dikemaskini ${timeText} · Auto setiap 3 minit`;
      document.getElementById('footer-updated').textContent = text;
      const drawerUpdated = document.getElementById('drawer-updated');
      if (drawerUpdated) drawerUpdated.textContent = text;
      if (isNationwide) {
        document.getElementById('nationwide-summary-footer').textContent =
          `Sumber data: MET Malaysia / data.gov.my · ${text}`;
      }
    }

    // Nationwide mode: one thunderstorm fetch (buildWarningApiUrl omits
    // contains= when cfg.apiName is null, see weather-core.js) + one rain
    // fetch (fetchRainWarningsRaw — the proxy was already unfiltered),
    // aggregated across all 16 states in memory by
    // computeWarningStateNationwide(). ?testWarning= fixtures are
    // single-cfg only (getTestWarningFixture needs a real cfg.apiName)
    // and are simply ignored here — ?raw/live data is used instead.
    async function refreshWarningsNationwide() {
      const [thunder, rain] = await Promise.allSettled([
        fetchActiveWarnings(cfg),
        fetchRainWarningsRaw(),
      ]);

      if (thunder.status === 'rejected' && rain.status === 'rejected') {
        console.warn('[weather] Both warning sources failed:', thunder.reason?.message, rain.reason?.message);
      } else {
        if (thunder.status === 'rejected') console.warn('[weather] data.gov.my warnings failed:', thunder.reason?.message);
        if (rain.status === 'rejected') console.warn('[weather] rain proxy failed (expected under local static server):', rain.reason?.message);
        const combined = dedupeAcrossSources([
          ...(thunder.status === 'fulfilled' ? thunder.value : []),
          ...(rain.status === 'fulfilled' ? rain.value : []),
        ]);
        const state = computeWarningStateNationwide(combined, STATE_CONFIG);
        nationwideDistrictTiers = state.districts;
        nationwideOverlap = state.overlap || new Set();
        nationwideStateWash = state.stateWash;
        nationwidePerState = state.perState;
        nationwideActiveWarnings = combined.filter(isWarningActive);
      }
    }

    async function refreshWarnings() {
      lastCheckedAt = new Date();

      if (isNationwide) {
        await refreshWarningsNationwide();
        repaintMap();
        renderCards();
        renderNationwidePanel();
        applyForecastWarningAccent();
        updateFooter();
        return;
      }

      const fixture = getTestWarningFixture(TEST_WARNING_PARAM, cfg);
      if (fixture !== undefined) {
        activeWarnings = fixture.filter(isWarningActive);
        const state = computeWarningState(activeWarnings, cfg);
        warningScope = state.scope;
        warningDistricts = state.districts;
        warningOverlap = state.overlap || new Set();
        warningStateTier = state.stateTier;
      } else {
        // Two independent sources, fetched in parallel — either failing
        // alone must not take down the other (rain proxy 404s under local
        // static servers by design; data.gov.my can have its own bad day).
        const [thunder, rain] = await Promise.allSettled([
          fetchActiveWarnings(cfg),
          fetchRainWarnings(cfg),
        ]);

        if (thunder.status === 'rejected' && rain.status === 'rejected') {
          console.warn('[weather] Both warning sources failed:', thunder.reason?.message, rain.reason?.message);
          // Leave the previously-known state on screen rather than clearing
          // it to a false "no warning" on a transient failure.
        } else {
          if (thunder.status === 'rejected') console.warn('[weather] data.gov.my warnings failed:', thunder.reason?.message);
          if (rain.status === 'rejected') console.warn('[weather] rain proxy failed (expected under local static server):', rain.reason?.message);
          activeWarnings = dedupeAcrossSources([
            ...(thunder.status === 'fulfilled' ? thunder.value : []),
            ...(rain.status === 'fulfilled' ? rain.value : []),
          ]);
          const state = computeWarningState(activeWarnings, cfg);
          warningScope = state.scope;
          warningDistricts = state.districts;
          warningOverlap = state.overlap || new Set();
          warningStateTier = state.stateTier;
        }
      }

      repaintMap();
      renderCards();
      applyForecastWarningAccent();
      updateFooter();
    }

    // ?export PNG capture — share card = live map + title/timestamp header
    // + legend + source footer, composed on one canvas. The map half is
    // composited manually (tiles + overlay SVG + label texts, each drawn
    // at its measured screen rect) instead of html2canvas: the library
    // misreads Leaflet's translated panes at some pan offsets and
    // bakes a shifted overlay into the PNG. Measured rects cannot shift.
    // Zoom controls are skipped (sources stay credited in the footer line).
    function drawMapLabels(c, mapEl, rect) {
      mapEl.querySelectorAll('.leaflet-tooltip').forEach(el => {
        if (el.offsetParent === null) return;
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) return;
        const cx = r.left - rect.left + r.width / 2;
        const top = r.top - rect.top;
        // Split into styled lines: bare text nodes use the tooltip's
        // own size, child spans (nationwide \u201CDistrict, State\u201D two-liner)
        // use their own computed size.
        const lines = [];
        let cur = { text: '', size: parseFloat(window.getComputedStyle(el).fontSize) || 12 };
        el.childNodes.forEach(n => {
          if (n.nodeType === 3) { cur.text += n.textContent; }
          else if (n.nodeName === 'BR') { lines.push(cur); cur = { text: '', size: cur.size }; }
          else {
            if (cur.text) { lines.push(cur); cur = { text: '', size: cur.size }; }
            const size = parseFloat(window.getComputedStyle(n).fontSize) || cur.size;
            n.childNodes.forEach(cn => {
              if (cn.nodeType === 3 && cn.textContent.trim()) lines.push({ text: cn.textContent.trim(), size });
            });
          }
        });
        if (cur.text.trim()) lines.push({ text: cur.text.trim(), size: cur.size });
        const clean = lines.map(l => ({ text: l.text.trim(), size: l.size })).filter(l => l.text);
        if (!clean.length) return;
        const lh = i => clean[i].size * 1.2;
        let y = top;
        clean.forEach((l, i) => {
          y += (i === 0 ? lh(0) / 2 : (lh(i - 1) + lh(i)) / 2);
          c.font = `700 ${l.size}px system-ui, sans-serif`;
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.lineWidth = Math.max(2, l.size * 0.22);
          c.strokeStyle = 'rgba(0,0,0,0.85)';
          c.strokeText(l.text, cx, y);
          c.fillStyle = '#ffffff';
          c.fillText(l.text, cx, y);
        });
      });
    }

    function captureMapCanvas() {
      return new Promise((resolve, reject) => {
        const mapEl = document.getElementById('map');
        const rect = mapEl.getBoundingClientRect();
        const scale = 2;
        const out = document.createElement('canvas');
        out.width = Math.round(rect.width * scale);
        out.height = Math.round(rect.height * scale);
        const c = out.getContext('2d');
        c.scale(scale, scale);
        c.fillStyle = isDarkMode() ? '#05070c' : '#ffffff';
        c.fillRect(0, 0, rect.width, rect.height);
        mapEl.querySelectorAll('.leaflet-tile-pane img.leaflet-tile').forEach(img => {
          if (!img.complete || !img.naturalWidth) return;
          const r = img.getBoundingClientRect();
          try { c.drawImage(img, r.left - rect.left, r.top - rect.top, r.width, r.height); }
          catch (e) { throw new Error('tile draw failed (CORS?): ' + e.message); }
        });
        const svg = mapEl.querySelector('.leaflet-overlay-pane svg');
        const done = () => { drawMapLabels(c, mapEl, rect); resolve(out); };
        if (!svg) { done(); return; }
        const r = svg.getBoundingClientRect();
        const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml;charset=utf-8' }));
        const im = new Image();
        im.onload = () => {
          try { c.drawImage(im, r.left - rect.left, r.top - rect.top, r.width, r.height); }
          catch (e) { URL.revokeObjectURL(url); reject(e); return; }
          URL.revokeObjectURL(url);
          done();
        };
        im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('overlay raster failed')); };
        im.src = url;
      });
    }

    function localStamp(d) {
      const p2 = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}`;
    }

    async function exportMapImage() {
      const btn = document.getElementById('export-btn');
      const label = btn.querySelector('span');
      const prev = label.textContent;
      btn.disabled = true;
      label.textContent = 'Mengeksport\u2026';
      try {
        const dark = isDarkMode();
        const mapCanvas = await captureMapCanvas();
        const W = mapCanvas.width;
        const headerH = Math.round(W * 0.075);
        const rowH = Math.round(W * 0.028);
        const pad = Math.round(W * 0.02);
        const legend = [
          ['Ribut Petir / Hujan Lebat', '#2516d2', false],
          ['Waspada', '#fdfe00', false],
          ['Buruk', '#fea402', false],
          ['Bahaya', '#fa0101', false],
          ['Hujan + Ribut Petir', '#fdfe00', true]
        ];
        // Legend chips flow left-to-right in one line, wrapping only if
        // the viewport is too narrow — rows are centred as a group.
        const meas = document.createElement('canvas').getContext('2d');
        meas.font = `${Math.round(rowH * 0.55)}px system-ui, sans-serif`;
        const sw = Math.round(rowH * 0.6);
        const gap = rowH * 0.9;
        const items = legend.map(([name, fill, dashed]) => ({ name, fill, dashed, w: sw + rowH * 0.3 + meas.measureText(name).width }));
        const rows = [[]];
        let rowW = 0;
        items.forEach(it => {
          const cur = rows[rows.length - 1];
          const need = (cur.length ? gap : 0) + it.w;
          if (cur.length && rowW + need > W - pad * 2) { rows.push([it]); rowW = it.w; }
          else { if (cur.length) rowW += gap; cur.push(it); rowW += it.w; }
        });
        const rowWidths = rows.map(r => r.reduce((a, it, i) => a + it.w + (i ? gap : 0), 0));
        const legendH = pad * 2 + rows.length * rowH;
        const footerH = Math.round(W * 0.035);
        const out = document.createElement('canvas');
        out.width = W;
        out.height = headerH + mapCanvas.height + legendH + footerH;
        const c = out.getContext('2d');
        c.fillStyle = dark ? '#09090b' : '#ffffff';
        c.fillRect(0, 0, out.width, out.height);
        c.textBaseline = 'middle';
        c.fillStyle = dark ? '#f4f4f5' : '#18181b';
        c.font = `700 ${Math.round(headerH * 0.42)}px system-ui, sans-serif`;
        c.fillText(`Cuaca ${cfg.displayName}`, pad, headerH / 2);
        const stamp = document.getElementById('footer-updated').textContent || '';
        c.font = `${Math.round(headerH * 0.28)}px system-ui, sans-serif`;
        c.fillStyle = dark ? '#a1a1aa' : '#52525b';
        c.fillText(stamp, W - pad - c.measureText(stamp).width, headerH / 2);
        c.drawImage(mapCanvas, 0, headerH);
        c.font = `${Math.round(rowH * 0.55)}px system-ui, sans-serif`;
        c.textAlign = 'left';
        rows.forEach((row, ri) => {
          const cy = headerH + mapCanvas.height + pad + rowH * ri + rowH / 2;
          let x = (W - rowWidths[ri]) / 2;
          row.forEach(({ name, fill, dashed, w }) => {
            c.fillStyle = fill;
            if (c.roundRect) { c.beginPath(); c.roundRect(x, cy - sw / 2, sw, sw, sw * 0.25); c.fill(); }
            else { c.fillRect(x, cy - sw / 2, sw, sw); }
            if (dashed) {
              c.setLineDash([sw * 0.3, sw * 0.2]);
              c.strokeStyle = '#2516d2';
              c.lineWidth = Math.max(2, sw * 0.18);
              c.strokeRect(x, cy - sw / 2, sw, sw);
              c.setLineDash([]);
            }
            c.fillStyle = dark ? '#f4f4f5' : '#18181b';
            c.fillText(name, x + sw + rowH * 0.3, cy);
            x += w + gap;
          });
        });
        c.font = `${Math.round(footerH * 0.4)}px system-ui, sans-serif`;
        c.fillStyle = dark ? '#71717a' : '#a1a1aa';
        c.fillText('Sumber: MET Malaysia / data.gov.my', pad, headerH + mapCanvas.height + legendH + footerH / 2);
        const a = document.createElement('a');
        a.download = `amaran-cuaca-${activeStateKey}-${localStamp(new Date())}.png`;
        a.href = out.toDataURL('image/png');
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {
        console.warn('[weather] Export failed:', e.message);
      } finally {
        label.textContent = prev;
        btn.disabled = false;
      }
    }

    function initExportButton() {
      const btn = document.getElementById('export-btn');
      btn.classList.remove('hidden');
      btn.addEventListener('click', exportMapImage);
    }

    function initTestModeBanner() {
      if (!TEST_WARNING_PARAM) return;
      const el = document.getElementById('test-mode-banner');
      el.hidden = false;
      el.textContent = `🧪 MOD UJIAN AKTIF — testWarning=${TEST_WARNING_PARAM} (data ujian, bukan amaran sebenar)`;
    }

    // ?windtest Spike A — free particle proof with ZERO backend. A small
    // synthetic smooth field over the whole-Malaysia box (prevailing
    // easterly + a slow swirl, hand-built — clearly labelled TEST DATA,
    // never a forecast) in the exact record shape leaflet-velocity's
    // WindJS builder reads: u = parameterCategory 2 / number 2,
    // v = 2 / 3, origin at the north-west corner, dy stepping southward.
    // Edges feather to zero (smoothstep over an 8% margin) so particles
    // dissolve instead of hitting a hard rectangle.
    function buildSyntheticWind() {
      const lo1 = 98.5, la1 = 8.0, dx = 0.1, dy = 0.1, nx = 215, ny = 100;
      const edge = 0.08;
      const smooth = t => { t = Math.min(Math.max(t, 0), 1); return t * t * (3 - 2 * t); };
      const u = [], v = [];
      for (let j = 0; j < ny; j++) {
        const lat = la1 - j * dy;
        const fy = smooth(Math.min(j, ny - 1 - j) / (ny * edge));
        for (let i = 0; i < nx; i++) {
          const lon = lo1 + i * dx;
          const fx = smooth(Math.min(i, nx - 1 - i) / (nx * edge));
          const f = Math.min(fx, fy);
          const a = (lon - 99) * 0.45, b = lat * 0.9;
          u.push((-(3 + 2 * Math.sin(b) * Math.cos(a)) + 1.2 * Math.sin(a + b)) * f);
          v.push((1.5 * Math.sin(a) * Math.cos(b * 0.7) + 0.6 * Math.cos(a - b)) * f);
        }
      }
      const head = (n) => ({ parameterCategory: 2, parameterNumber: n, nx, ny, lo1, la1, dx, dy, refTime: new Date().toISOString(), forecastTime: 0 });
      return [{ header: head(2), data: u }, { header: head(3), data: v }];
    }

    function ensureVelocityLib() {
      if (window.L && window.L.velocityLayer) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('leaflet-velocity load failed'));
        document.head.appendChild(s);
      });
    }

    // Own pane between tiles (200) and districts (400), click-through so
    // particles never swallow taps meant for the map underneath. Density
    // rescales with zoom (same count packs tighter zoomed out), via the
    // plugin's own setOptions restart path — verified in its source.
    let windLayer = null;
    const WIND_BASE_MULT = 1 / 300; // plugin default: looks right zoomed in
    function windDensityForZoom(z) {
      return WIND_BASE_MULT * Math.min(1, Math.max(0.15, Math.pow(2, (z - 7) * 0.8)));
    }
    function applyWindDensity() {
      if (windLayer && map) windLayer.setOptions({ particleMultiplier: windDensityForZoom(map.getZoom()) });
    }
    function initWindTest() {
      ensureVelocityLib().then(() => {
        if (!map.createPane) return;
        map.createPane('windPane');
        const pane = map.getPane('windPane');
        pane.style.zIndex = 350;
        pane.style.pointerEvents = 'none';
        windLayer = L.velocityLayer({
          displayValues: false,
          data: buildSyntheticWind(),
          paneName: 'windPane',
          velocityScale: 0.008,
          maxVelocity: 12,
          minVelocity: 0,
          particleMultiplier: windDensityForZoom(map.getZoom()),
          opacity: 0.85
        });
        windLayer.addTo(map);
        map.on('zoomend', applyWindDensity);
        console.info('[weather] ?windtest particle layer on (SYNTHETIC test data, not a forecast)');
      }).catch(err => console.warn('[weather] wind spike failed:', err.message));
    }

    // =========================================================
    // Forecast (daily granularity — Pagi/Petang/Malam + min–maks),
    // follows `focusDistrict` (settable via the district select) via the
    // by-name MET lookup (contains=<name>@location__location_name).
    // =========================================================
    function localDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // Finite set of Malay phrases from the API → icon. Unmapped phrases warn
    // instead of silently showing the wrong sky. 'berangin' (windy) has no
    // matching symbol in the sprite, so it still falls back to an emoji.
    function forecastIcon(phrase, slot) {
      const p = (phrase || '').toLowerCase();
      if (!p) return '—';

      const svg = (inner) => `<svg class="wicon" viewBox="0 0 100 100">${inner}</svg>`;

      if (p.includes('ribut petir')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
          '<use href="#wicon-gray-cloud" x="25" y="10" class="w-cloud-float-reverse" fill="url(#gradDarkGray)"/>' +
          '<use href="#wicon-thunder-bolt" x="30" y="61" class="w-lighting"/>' +
          '<use href="#wicon-white-cloud" x="7"/>' +
          '<use href="#wicon-thunder-bolt" x="45" y="56" class="w-lighting w-delay-1"/>'
        );
      }

      if (p.includes('tiada hujan')) {
        return slot === 'malam'
          ? svg(
            '<use href="#wicon-moon" x="-15"/>' +
            '<use href="#wicon-star" x="42" y="30" class="w-star"/>' +
            '<use href="#wicon-star" x="61" y="32" class="w-star w-delay-1"/>' +
            '<use href="#wicon-star" x="55" y="50" class="w-star w-delay-2"/>'
          )
          : svg('<use href="#wicon-sun"/>');
      }

      if (p.includes('hujan')) {
        if (p.includes('beberapa') || p.includes('satu dua')) {
          return slot === 'malam'
            ? svg(
              '<use href="#wicon-moon" x="-20" y="-15"/>' +
              '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
              '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
              '<use href="#wicon-rain-drop" x="45" y="65" class="w-drop3"/>' +
              '<use href="#wicon-white-cloud" x="7"/>'
            )
            : svg(
              '<use href="#wicon-sun" x="-12" y="-18"/>' +
              '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
              '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
              '<use href="#wicon-rain-drop" x="45" y="65" class="w-drop3"/>' +
              '<use href="#wicon-white-cloud" x="7"/>'
            );
        }
        return svg(
          '<use href="#wicon-gray-cloud" x="25" y="10" class="w-cloud-float-reverse" fill="url(#gradDarkGray)"/>' +
          '<use href="#wicon-rain-drop" x="15" y="65" class="w-drop4"/>' +
          '<use href="#wicon-rain-drop" x="25" y="65" class="w-drop1"/>' +
          '<use href="#wicon-rain-drop" x="37" y="65" class="w-drop2"/>' +
          '<use href="#wicon-rain-drop" x="50" y="65" class="w-drop3"/>' +
          '<use href="#wicon-white-cloud" x="5" y="-7"/>'
        );
      }

      if (p.includes('jerebu')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradDarkGray)" x="0" y="20"/>' +
          '<use href="#wicon-gray-cloud" x="30" y="30" class="w-cloud-float-reverse" fill="url(#gradGray)"/>' +
          '<use href="#wicon-mist" x="0" y="30" class="w-mist"/>'
        );
      }

      if (p.includes('berangin')) return '💨';

      if (p.includes('berawan') || p.includes('mendung')) {
        return svg(
          '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
          '<use href="#wicon-white-cloud" x="7"/>'
        );
      }

      console.warn('[weather] Unmapped forecast phrase:', phrase);
      return svg(
        '<use href="#wicon-sun" x="-12" y="-18"/>' +
        '<use href="#wicon-gray-cloud" class="w-cloud-float" fill="url(#gradGray)"/>' +
        '<use href="#wicon-white-cloud" x="7"/>'
      );
    }

    function tierWash(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyForecastWarningAccent() {
      const tier = focusDistrict
        ? (warningDistricts.get(focusDistrict) || (warningScope === 'state' ? warningStateTier : null))
        : null;

      const head = document.getElementById('forecast-head');
      const badge = document.getElementById('forecast-warn-badge');

      if (tier) {
        const c = TIER_COLORS[tier] || TIER_COLORS.amaran;
        head.style.borderColor = c.fill;
        head.style.backgroundColor = tierWash(c.fill, 0.18);
        badge.querySelector('.tier-swatch').style.background = c.fill;
        badge.querySelector('.tier-label').textContent = tierRowLabel(tier);
        badge.hidden = false;
      } else {
        head.style.borderColor = 'transparent';
        head.style.backgroundColor = 'transparent';
        badge.hidden = true;
      }
    }

    function renderForecast() {
      const card = document.getElementById('forecast-card');

      // No district picked yet — hide the whole card rather than showing
      // it full of "—" placeholders. card starts `hidden` in the markup
      // too, so there's no flash of an empty card before this runs.
      if (!focusDistrict) {
        card.hidden = true;
        fitSideColumnToViewport();
        return;
      }
      card.hidden = false;

      applyForecastWarningAccent();
      document.getElementById('forecast-district-name').textContent = focusDistrict;

      if (!forecastToday) {
        // District just picked, first fetch hasn't landed yet — keep "—"
        // placeholders (never show stale data from a prior district).
        document.getElementById('forecast-temp').textContent = '—';
        ['pagi', 'petang', 'malam'].forEach(slot => {
          document.getElementById(`slot-icon-${slot}`).textContent = '—';
          document.getElementById(`slot-text-${slot}`).textContent = '—';
        });
        fitSideColumnToViewport();
        return;
      }

      const f = forecastToday;
      document.getElementById('forecast-temp').textContent =
        (f.min_temp != null && f.max_temp != null) ? `${f.min_temp}° – ${f.max_temp}°` : '—';
      [['pagi', f.morning_forecast], ['petang', f.afternoon_forecast], ['malam', f.night_forecast]]
        .forEach(([slot, phrase]) => {
          document.getElementById(`slot-icon-${slot}`).innerHTML = forecastIcon(phrase, slot);
          document.getElementById(`slot-text-${slot}`).textContent = phrase || '—';
        });
      // renderForecast() runs independently of renderCards() — a district
      // pick or the forecast API landing both change #side-column's height
      // on their own, so this needs its own re-fit call rather than relying
      // on whatever renderCards() last measured (that's the bug: content
      // grew here AFTER renderCards() already fit an earlier, shorter version).
      fitSideColumnToViewport();
    }

    async function refreshForecast() {
      if (!focusDistrict) { renderForecast(); return; }
      try {
        const url = `https://api.data.gov.my/weather/forecast?contains=${encodeURIComponent(focusDistrict)}@location__location_name`;
        const resp = await fetchWithTimeout(url, 8000);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const rows = await resp.json();
        // API sorts date-DESCENDING — limit= would return the FURTHEST
        // days, so fetch all and pick today explicitly.
        const today = localDateStr(new Date());
        const row = (Array.isArray(rows) ? rows : []).find(r => r.date === today);
        if (row) forecastToday = row;
        renderForecast();
      } catch (e) {
        // Keep last-known forecast on screen; placeholders only before
        // the first-ever success for this district.
        console.warn('[weather] Forecast fetch failed:', e.message);
      }
    }

    // =========================================================
    // Boot + refresh loop
    // =========================================================
    async function boot() {
      try {
        STATE_CONFIG = await loadStateConfig();
      } catch (e) {
        console.warn('[weather] Failed to load states.json:', e.message);
        showStateBanner('Gagal memuatkan konfigurasi negeri (states.json). Sila cuba muat semula halaman.');
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const stateKey = (params.get('state') || 'malaysia').toLowerCase();
      cfg = STATE_CONFIG[stateKey];
      if (!cfg) {
        showStateBanner(`Negeri tidak dikenali: "${params.get('state')}" — kembali ke Malaysia.`);
        cfg = STATE_CONFIG['malaysia'] || Object.values(STATE_CONFIG)[0];
      }
      isNationwide = !cfg.stateCode;
      document.getElementById('page-footer').hidden = isNationwide;

      document.title = `Cuaca ${cfg.displayName} — Amaran & Peta Daerah`;
      document.getElementById('page-heading').textContent = `Cuaca ${cfg.displayName}`;

      activeStateKey = stateKey in STATE_CONFIG ? stateKey : 'malaysia';
      populateStateSelect(activeStateKey);
      populateDistrictSelect();
      initLocationPopover();
      initNationwideSummaryToggle();
      initSheetHandle();
      initMobileDrawer();
      layoutMobileNodes();
      initThemeToggle();
      if (EXPORT_PARAM) initExportButton();
      renderClock();
      renderForecast(); // hides the forecast card immediately (no district picked yet)
      renderCards();    // paint both empty warning-card states immediately, before first fetch
      renderNationwidePanel();

      // =========================================================
      // Initialize Map — interaction enabled (real page, not a kiosk).
      // The district select's fitBounds/setView calls still work
      // regardless — the viewer can then freely pan/zoom afterward.
      // =========================================================
      map = L.map('map', {
        zoomControl: true,
        dragging: true,
        scrollWheelZoom: false, // replaced by initStepWheelZoom() below — see its own comment for why
        doubleClickZoom: true,
        boxZoom: true,
        keyboard: true,
        touchZoom: true,
        zoomSnap: 0, // no rounding — needed so cfg.zoom's fractional values (e.g. Pahang's 8.7) aren't snapped to an integer
      }).setView(activeCenter() || [3.8648, 109.3107], activeZoom() || 6.4);
      // Provisional — resetMapView() (after GeoJSON loads) corrects this via
      // fitBounds() for any state whose cfg.zoom/center are still unset (every
      // current states.json entry has both, so the || fallback above is only
      // a safety net against L.map().setView(null, null) throwing outright
      // for a future state added without them — not a real nationwide-only
      // default anymore, just a reasonable center of the country).

      map.on('zoomend', applyNationwideLabelMode); // no-op outside nationwide mode / before geojsonLayer exists
      map.on('zoomend', declutterDistrictLabels); // no-op in nationwide mode / before geojsonLayer exists
      map.on('moveend', declutterDistrictLabels); // re-separate labels after pans (and programmatic fitBounds)
      map.on('zoomend', restyleStateBoundary); // no-op before stateBoundaryLayer exists (single-state mode never creates one)
      initStepWheelZoom(map);
      if (WINDTEST_PARAM) initWindTest();

      // initTileLayer() itself is deferred to loadGeoJSON() below, once the
      // map's FINAL view (resetMapView()) is already known — see that
      // function's own comment for why creating it against this provisional
      // view first would be a mistake, not just a missed optimization.

      initTestModeBanner();
      updateFullscreenClass();
      window.addEventListener('resize', updateFullscreenClass);
      // Order matters: updateFullscreenClass() must apply first so the
      // fullscreen font-size class (if any) is already in effect by the
      // time fitSideColumnToViewport() measures clientHeight/scrollHeight.
      window.addEventListener('resize', fitSideColumnToViewport);
      initSideColumnFitObserver();
      if (RAW_PARAM) initRawDebugOverlay();
      if (CHANGELOG_PARAM) initChangelogOverlay();
      if (DEBUG_ZOOM_PARAM) initDebugZoomReadout();
      if (DEBUG_SIZE_PARAM) initDebugSizeReadout();
      if (DEBUG_PARAM) initDebugOverlay();
      loadGeoJSON();

      // No point polling on an interval when serving a static fixture —
      // ?testWarning= is meant to be reloaded manually to test a new value.
      if (!TEST_WARNING_PARAM) {
        setInterval(() => {
          if (geojsonLayer) refreshWarnings();
        }, REFRESH_MS);

        // Throttled: rapid tab-switching must not burst requests at
        // data.gov.my (per-IP rate limit → HTTP 429). The 3-min interval
        // above still guarantees freshness.
        const VISIBILITY_MIN_GAP_MS = 60 * 1000;
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState !== 'visible' || !geojsonLayer) return;
          if (lastCheckedAt && (Date.now() - lastCheckedAt.getTime()) < VISIBILITY_MIN_GAP_MS) return;
          refreshWarnings();
        });
      }

      setInterval(() => { if (focusDistrict) refreshForecast(); }, FORECAST_REFRESH_MS);

      // Minute tick: keep "X minit lepas / lagi" honest and refresh the clock.
      setInterval(() => {
        renderCards();
        renderClock();
      }, TICK_MS);
    }

    boot();
  </script>

</body>
