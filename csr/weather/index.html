<!DOCTYPE html>
<html lang="ms" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuaca Malaysia — Amaran &amp; Peta Daerah</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN — matches root index.html's setup -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Archivo', 'Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Anti-flash: apply the saved theme before first paint — same
       technique as root index.html (classList-based, not data-theme). -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.replace('light', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- ABSOLUTE path — the Vercel cleanUrls lesson: relative paths
       resolve one level too high on slash-less directory URLs.
       ?v= cache-buster — bump it on every style.css change so phones
       drop their cached copy immediately instead of sitting on stale
       CSS (Chrome Android caches the query-less URL aggressively). -->
  <link rel="stylesheet" href="/csr/weather/style.css?v=2" />
</head>

<body class="font-sans antialiased bg-zinc-50 dark:bg-zinc-950 text-zinc-950 dark:text-zinc-50">

  <!-- Animated weather-icon sprite (gradients + symbols, reused via <use>
       by forecastIcon() in the script below). Design credit:
       Atiya Haider (https://codepen.io/atiyahaider), adapted from a public
       CodePen — no snow/ice symbols kept, Malaysia's forecast never uses them. -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="gradYellow" cx="50%" cy="50%" r="80%" fx="90%" fy="80%">
        <stop offset="0%" stop-color="yellow" />
        <stop offset="100%" stop-color="orange" />
      </radialGradient>
      <radialGradient id="gradDarkGray" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
        <stop offset="0%" stop-color="white" />
        <stop offset="70%" stop-color="gray" />
        <stop offset="100%" stop-color="dimgray" />
      </radialGradient>
      <radialGradient id="gradGray" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
        <stop offset="0%" stop-color="white" />
        <stop offset="100%" stop-color="darkgray" />
      </radialGradient>
      <linearGradient id="gradWhite" x1="40%" y1="50%" x2="90%" y2="90%">
        <stop offset="0%" stop-color="white" />
        <stop offset="100%" stop-color="darkgray" />
      </linearGradient>
    </defs>

    <symbol id="wicon-sun">
      <circle cx="50" cy="50" r="20" fill="url(#gradYellow)" />
      <line x1="50" y1="27" x2="50" y2="2" class="w-long-ray" />
      <line x1="50" y1="73" x2="50" y2="98" class="w-long-ray" />
      <line x1="27" y1="50" x2="2" y2="50" class="w-long-ray" />
      <line x1="73" y1="50" x2="98" y2="50" class="w-long-ray" />
      <line x1="34" y1="34" x2="16" y2="16" class="w-long-ray" />
      <line x1="66" y1="66" x2="84" y2="84" class="w-long-ray" />
      <line x1="34" y1="66" x2="16" y2="84" class="w-long-ray" />
      <line x1="66" y1="34" x2="84" y2="16" class="w-long-ray" />
      <line x1="59" y1="29" x2="66" y2="13" class="w-short-ray" />
      <line x1="71" y1="42" x2="87" y2="35" class="w-short-ray" />
      <line x1="71" y1="58.5" x2="87" y2="65" class="w-short-ray" />
      <line x1="59" y1="71" x2="66" y2="87" class="w-short-ray" />
      <line x1="41" y1="71" x2="34" y2="87" class="w-short-ray" />
      <line x1="29.5" y1="58.5" x2="13" y2="66" class="w-short-ray" />
      <line x1="29" y1="42" x2="13" y2="35" class="w-short-ray" />
      <line x1="41" y1="29" x2="35" y2="13" class="w-short-ray" />
    </symbol>

    <symbol id="wicon-moon">
      <path d="M60,20 A30,30 0 1,0 90,65 22,22 0 1,1 60,20z" fill="url(#gradYellow)" />
    </symbol>

    <symbol id="wicon-star">
      <polygon points="5,0 2,10 10,4 0,4 8,10" fill="url(#gradYellow)" />
    </symbol>

    <symbol id="wicon-gray-cloud">
      <path d="M20,15 Q25,0 45,11 Q60,5 60,20 A30,15 5 1,1 20,15 Z" />
    </symbol>

    <symbol id="wicon-white-cloud">
      <path fill="url(#gradWhite)" d="M11,47 Q13,37 21,42 Q31,30 41,38 A28,21 -25 1,1 35,75 Q23,85 19,73 A12,12 0 0,1 11,47Z" />
    </symbol>

    <symbol id="wicon-rain-drop">
      <path fill="lightblue" d="M10 0 Q10,0 14,7 A5,5 0 1,1 6,7 Q10,0 10,0Z" />
    </symbol>

    <symbol id="wicon-thunder-bolt">
      <path fill="#ffdd1a" d="M15,0 L1,23 L8,23 L0,40 L15,19 L8,19Z" />
    </symbol>

    <symbol id="wicon-mist">
      <path d="M5,34 L43,34" />
      <path d="M10,40 L40,40 Q51.5,40 50,35 T60,30 L80,30" />
      <path d="M15,45 L45,45 Q56.5,45 55,40 T65,35 L90,35" />
      <path d="M60,42 L85,42" />
    </symbol>
  </svg>

  <!-- Full-viewport map — every other element floats on top of this. -->
  <div id="map" class="fixed inset-0 z-0"></div>

  <!-- Top-left cluster: brand/controls bar + (nationwide-only) plain-text summary -->
  <div id="topleft-stack" class="fixed top-4 left-4 z-[1000] flex flex-col gap-3 max-w-lg">
    <header id="brand-bar"
      class="relative flex items-center gap-3 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md px-4 py-2.5 shadow-lg">
      <h1 id="page-heading" class="font-display font-bold text-base text-zinc-900 dark:text-zinc-100 whitespace-nowrap m-0">
        Cuaca Malaysia
      </h1>

      <button id="location-toggle" type="button" aria-haspopup="true" aria-expanded="false"
        aria-controls="location-popover" aria-label="Tukar negeri / daerah"
        class="inline-flex items-center justify-center w-8 h-8 rounded-full border border-zinc-200 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:border-zinc-400 dark:hover:border-zinc-500 transition-colors shrink-0">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor"
            d="M12 2C7.86 2 4.5 5.36 4.5 9.5c0 5.25 6.6 11.68 6.88 11.95a.9.9 0 0 0 1.24 0C12.9 21.18 19.5 14.75 19.5 9.5 19.5 5.36 16.14 2 12 2zm0 10.25a2.75 2.75 0 1 1 0-5.5 2.75 2.75 0 0 1 0 5.5z" />
        </svg>
      </button>

      <div id="location-popover" hidden
        class="absolute top-full left-0 mt-2 w-72 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white/95 dark:bg-zinc-900/95 backdrop-blur-md p-4 shadow-xl z-[1200] flex flex-col gap-3">
        <div>
          <label for="stateSelect" class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1">Negeri</label>
          <select id="stateSelect"
            class="w-full rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-2 text-sm text-zinc-900 dark:text-zinc-100"></select>
        </div>
        <div>
          <label for="districtSelect" class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1">Daerah</label>
          <select id="districtSelect"
            class="w-full rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-3 py-2 text-sm text-zinc-900 dark:text-zinc-100">
            <option value="">-- Pilih Daerah --</option>
          </select>
        </div>
      </div>

      <div class="ml-auto flex flex-col items-end leading-tight shrink-0">
        <span id="live-clock" class="font-display font-bold text-sm text-zinc-900 dark:text-zinc-100">—</span>
        <span id="live-date" class="text-[11px] text-zinc-500 dark:text-zinc-400 whitespace-nowrap">—</span>
      </div>

      <button id="theme-toggle" type="button" aria-label="Tukar tema"
        class="inline-flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-1.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors shrink-0">
        <svg class="hidden dark:block h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
        <svg class="block dark:hidden h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
      </button>

      <button id="export-btn" type="button" aria-label="Eksport peta sebagai PNG"
        class="hidden inline-flex items-center gap-1.5 rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 px-2 py-1.5 text-xs font-semibold text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors shrink-0">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42L11 12.59V4a1 1 0 0 1 1-1zM5 19a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1z"/></svg>
        <span>Eksport</span>
      </button>
      <button id="menu-toggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="mobile-drawer"
        class="inline-flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-1.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors shrink-0">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 6h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2zm0 5h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2zm0 5h16a1 1 0 1 1 0 2H4a1 1 0 1 1 0-2z"/></svg>
      </button>
    </header>
  </div>

  <!-- Mobile-only drawer (<768px): settings + legend colour key behind a
       hamburger — desktop never shows this (see style.css). #theme-toggle,
       #export-btn and #map-legend NODES move here below 768px via
       layoutMobileNodes(), so there is exactly one copy of each, never a
       synced duplicate that can drift. -->
  <div id="drawer-backdrop"></div>
  <aside id="mobile-drawer" aria-label="Menu">
    <div class="flex items-center gap-2 px-4 py-3 border-b border-zinc-200 dark:border-zinc-700 shrink-0">
      <span class="font-display font-bold text-sm text-zinc-900 dark:text-zinc-100">Menu</span>
      <button id="drawer-close" type="button" aria-label="Tutup menu"
        class="ml-auto inline-flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-1.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors shrink-0">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </div>
    <div class="flex flex-col gap-4 px-4 py-4 overflow-y-auto">
      <div id="drawer-theme-slot" class="flex items-center justify-between gap-3">
        <span class="text-sm font-semibold text-zinc-700 dark:text-zinc-300">Tema paparan</span>
      </div>
      <div id="drawer-export-slot"></div>
      <div id="drawer-legend-slot"></div>
      <div class="border-t border-zinc-200 dark:border-zinc-700 pt-3 text-[11px] leading-relaxed text-zinc-500 dark:text-zinc-400">
        <div>Sumber data: MET Malaysia / data.gov.my</div>
        <div id="drawer-updated">—</div>
      </div>
    </div>
  </aside>

  <!-- Side column: legend + forecast + 2 warning cards. Always right —
       standardized across every state, including Sabah/Sarawak, which
       used to flip to the left. -->
  <div id="side-column" class="fixed top-4 bottom-4 right-4 z-[1000] flex flex-col gap-3 w-[440px] max-w-[92vw] overflow-visible">
    <!-- Mobile-only (<768px) pull tab — desktop never shows this (see
         style.css's mobile media query for the display override). Acts
         as #side-column's peek-state content and expand/collapse toggle;
         see setSheetExpanded()/initSheetHandle() in the inline script. -->
    <button id="sheet-handle" type="button" aria-expanded="false" aria-controls="side-column"
      class="hidden relative items-center gap-2 px-4 pt-3.5 pb-2.5 text-left shrink-0">
      <span class="absolute top-1.5 left-1/2 -translate-x-1/2 w-10 h-1.5 rounded-full bg-zinc-300 dark:bg-zinc-600"></span>
      <span id="sheet-handle-text" class="font-display font-semibold text-sm text-zinc-900 dark:text-zinc-100 truncate">—</span>
      <svg id="sheet-handle-chevron" class="ml-auto shrink-0 transition-transform" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M7 10l5 5 5-5z" />
      </svg>
    </button>

    <section id="map-legend"
      class="rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md p-4 shadow-lg shrink-0">
      <div class="font-display font-bold text-sm text-zinc-900 dark:text-zinc-100 mb-2">Status Daerah</div>
      <div class="flex items-center gap-2 text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">
        <span class="w-3.5 h-3.5 rounded shrink-0" style="background:#2516d2"></span>Ribut Petir / Hujan Lebat
      </div>
      <div class="flex items-center gap-2 text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">
        <span class="w-3.5 h-3.5 rounded shrink-0" style="background:#fdfe00"></span>Waspada
      </div>
      <div class="flex items-center gap-2 text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">
        <span class="w-3.5 h-3.5 rounded shrink-0" style="background:#fea402"></span>Buruk
      </div>
      <div class="flex items-center gap-2 text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">
        <span class="w-3.5 h-3.5 rounded shrink-0" style="background:#fa0101"></span>Bahaya
      </div>
      <div class="flex items-center gap-2 text-xs font-medium text-zinc-700 dark:text-zinc-300">
        <span class="w-3.5 h-3.5 rounded shrink-0" style="background:#fdfe00;border:3px dashed #2516d2"></span>Hujan + Ribut Petir
      </div>
    </section>

    <section id="forecast-card" hidden
      class="rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md shadow-lg overflow-hidden shrink-0">
      <div id="forecast-head" class="flex flex-wrap items-baseline gap-x-2.5 gap-y-1 px-5 py-3.5 border-[3px] border-transparent rounded-t-xl">
        <h2 id="forecast-district-name" class="font-display font-bold text-xl text-zinc-900 dark:text-zinc-100 m-0">Pilih daerah</h2>
        <span class="text-sm font-medium text-zinc-500 dark:text-zinc-400">Ramalan Cuaca</span>
        <span id="forecast-warn-badge" hidden class="ml-auto flex items-center gap-1.5">
          <span class="tier-swatch w-3 h-3 rounded shrink-0"></span>
          <span class="tier-label text-sm font-semibold text-zinc-900 dark:text-zinc-100"></span>
        </span>
      </div>
      <div class="flex flex-col gap-3 px-5 pb-5 pt-1">
        <div class="font-display text-4xl font-extrabold text-zinc-900 dark:text-zinc-100 whitespace-nowrap">
          <span id="forecast-temp">—</span>
          <small class="block font-sans text-xs font-normal text-zinc-500 dark:text-zinc-400">min – maks hari ini</small>
        </div>
        <div class="flex gap-6 justify-around">
          <div class="forecast-slot text-center min-w-0">
            <div class="text-[11px] font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Pagi</div>
            <div class="slot-icon flex items-center justify-center h-12 text-2xl" id="slot-icon-pagi">—</div>
            <div class="slot-text text-sm text-zinc-900 dark:text-zinc-100" id="slot-text-pagi">—</div>
          </div>
          <div class="forecast-slot text-center min-w-0">
            <div class="text-[11px] font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Petang</div>
            <div class="slot-icon flex items-center justify-center h-12 text-2xl" id="slot-icon-petang">—</div>
            <div class="slot-text text-sm text-zinc-900 dark:text-zinc-100" id="slot-text-petang">—</div>
          </div>
          <div class="forecast-slot text-center min-w-0">
            <div class="text-[11px] font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Malam</div>
            <div class="slot-icon flex items-center justify-center h-12 text-2xl" id="slot-icon-malam">—</div>
            <div class="slot-text text-sm text-zinc-900 dark:text-zinc-100" id="slot-text-malam">—</div>
          </div>
        </div>
      </div>
    </section>

    <section id="card-thunder" class="shrink-0"></section>
    <section id="card-rain" hidden class="shrink-0"></section>
  </div>

  <div id="test-mode-banner" hidden
    class="fixed top-4 left-1/2 -translate-x-1/2 z-[1100] rounded-lg border-2 border-dashed border-purple-500 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md px-4 py-2 text-sm font-semibold text-purple-600 dark:text-purple-400 shadow-lg">
  </div>
  <div id="state-error-banner" hidden
    class="fixed top-16 left-1/2 -translate-x-1/2 z-[1100] rounded-lg border-2 border-dashed border-red-500 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md px-4 py-2 text-sm font-semibold text-red-600 dark:text-red-400 shadow-lg">
  </div>

  <footer id="page-footer"
    class="fixed bottom-2 left-1/2 -translate-x-1/2 z-[900] flex gap-3 text-xs text-zinc-500 dark:text-zinc-400">
    <span id="footer-source">Sumber data: MET Malaysia / data.gov.my</span>
    <span id="footer-updated">—</span>
  </footer>

  <!-- Nationwide-only warning bar — bottom, full-width, collapsible
       (moved down here from topleft-stack: it used to sit under the
       header and cover Peninsular Malaysia + hide the location popover
       behind it). #page-footer above is hidden while this is active;
       its text is mirrored into #nationwide-summary-footer instead. -->
  <div id="nationwide-summary-bar" hidden
    class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[1000] w-[min(92vw,56rem)] rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md shadow-lg overflow-hidden">
    <button id="nationwide-summary-toggle" type="button" aria-expanded="true" aria-controls="nationwide-summary-list"
      class="w-full flex items-center gap-3 px-4 py-2.5 text-left">
      <h2 class="font-display font-bold text-sm text-zinc-900 dark:text-zinc-100 m-0">Amaran Aktif Seluruh Malaysia</h2>
      <span id="nationwide-summary-count" hidden class="rounded-full bg-red-600 text-white text-xs font-semibold px-2 py-0.5"></span>
      <span id="nationwide-summary-footer" class="ml-auto text-xs text-zinc-500 dark:text-zinc-400 whitespace-nowrap"></span>
      <svg id="nationwide-summary-chevron" class="shrink-0 transition-transform" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M7 10l5 5 5-5z" />
      </svg>
    </button>
    <ul id="nationwide-summary-list" class="text-sm text-zinc-700 dark:text-zinc-300 px-4 pb-3 max-h-[40vh] overflow-y-auto"></ul>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Shared fetch/parse/severity logic (also used by paparan/'s own
       independent fork — see that file's header comment) —
       ABSOLUTE path, the Vercel cleanUrls lesson -->
  <script src="/csr/weather/weather-core.js"></script>

  <script>
    // Config, parsing, severity tiers and ?testWarning= fixtures all come
    // from /csr/weather/weather-core.js — this inline script is ONLY the
    // page rendering: Leaflet wiring, dropdowns, forecast/warning cards.
    //
    // Redesign (2026-08-20): full-viewport interactive map (dropped the
    // fixed 1920x1080 kiosk #stage inherited from paparan/, switched the
    // CARTO basemap to its label-free tile variant — see initTileLayer()
    // — and rebuilt all chrome as floating Tailwind panels, matching root
    // index.html's dark/light convention instead of the old data-theme/
    // CSS-variable system). Map interaction (drag/zoom/scroll) is now
    // enabled — this is a real page, not a non-interactive kiosk.
    //
    // `focusDistrict` is the district the forecast card follows — null
    // until the viewer picks one from the district select (or it's
    // pre-set via ?district=). `highlightByName()` is the single entry
    // point for "district selection changed": it drives both the map
    // highlight/zoom AND the forecast card.

    const FORECAST_REFRESH_MS = 60 * 60 * 1000; // daily-granularity data — hourly is plenty
    const TICK_MS = 60 * 1000;                  // relative-time labels + clock refresh

    let map, geojsonLayer, tileLayer, stateBoundaryLayer;
    let fullGeoData = null; // cached nationwide districts — switchState() slices per-state views from this, no refetch
    let cfg = null;                   // active state's config entry (from states.json)
    let STATE_CONFIG = null;          // all loaded states, keyed by states.json's own keys
    let isNationwide = false;         // true for the "malaysia" entry (cfg.stateCode === null)
    let focusDistrict = null;         // district the forecast card follows; null = placeholder
    let activeStateKey = 'malaysia';  // states.json key of the on-screen state — feeds the ?export filename
    let warningDistricts = new Map(); // district name → severity tier (single-state mode)
    let warningOverlap = new Set();   // districts hit by BOTH thunder + rain (single-state mode)
    let warningScope = null;          // null | 'district' | 'state' (single-state mode)
    let warningStateTier = null;      // tier for the whole-state wash, when scope === 'state' (single-state mode)
    let nationwideDistrictTiers = new Map(); // district name → severity tier (nationwide mode)
    let nationwideOverlap = new Set();        // districts hit by BOTH sources (nationwide mode)
    let nationwideStateWash = new Map();     // stateCode → severity tier, vague state-wide warnings (nationwide mode)
    let nationwidePerState = new Map();      // stateCode → summary { tier, scope, districtCount, validTo, sources } (nationwide mode)
    let nationwideActiveWarnings = [];       // raw active warning objects, both sources (nationwide mode) — feeds the bottom summary bar's bulletin text
    let activeWarnings = [];          // filtered, currently-active warning objects
    let lastCheckedAt = null;
    let forecastToday = null;         // today's row from the forecast API, once fetched

    // ?testWarning= override — full syntax documented in weather-core.js.
    // Param NAME matched case-insensitively — manually-typed URLs can end
    // up with "testwarning" (e.g. mobile/TV keyboards lowercasing it).
    // ?windtest — Spike A: free wind-particle overlay proof (no backend).
    // Synthetic smooth test field (CLEARLY not a forecast) through the
    // open-source leaflet-velocity renderer, lazily loaded so normal page
    // loads pay nothing. All-lowercase for the same kiosk-keyboard reason
    // as ?raw — see its own comment.
    const WINDTEST_PARAM = (function () {
      for (const [key] of new URLSearchParams(window.location.search)) {
        if (key.toLowerCase() === 'windtest') return true;
      }
      return false;
    })();
    const TEST_WARNING_PARAM = (function () {
      for (const [key, value] of new URLSearchParams(window.location.search)) {
        if (key.toLowerCase() === 'testwarning') return value;
      }
      return null;
    })();

    // ?raw — shows a debug overlay with the actual unprocessed API
    // responses. All-lowercase (unlike ?testWarning=) so it can't be
    // mistyped into a different case.
    const RAW_PARAM = new URLSearchParams(window.location.search).has('raw');

    // ?changelog — shows this folder's CHANGELOG.md (user-facing release
    // history, v1 to now) in the same overlay styling as ?raw.
    // All-lowercase for the same reason as ?raw — see its own comment.
    const CHANGELOG_PARAM = new URLSearchParams(window.location.search).has('changelog');

    // ?debugzoom=1 — on-screen current-zoom readout, for hand-tuning
    // NATIONWIDE_LABEL_ZOOM_THRESHOLD (same "let them find it, then
    // hardcode it" technique as paparan/'s ?debugMap=1 framing tool).
    // All-lowercase for the same reason as ?raw — see its own comment.
    const DEBUG_ZOOM_PARAM = new URLSearchParams(window.location.search).has('debugzoom');

    // ?debugsize=1 — on-screen window.innerWidth×innerHeight readout, for
    // measuring the real viewport across browser chrome states (fullscreen
    // vs maximized with/without bookmarks bar) without opening DevTools.
    // All-lowercase for the same reason as ?raw — see its own comment.
    const DEBUG_SIZE_PARAM = new URLSearchParams(window.location.search).has('debugsize');

    // ?debug — self-documenting overlay listing every test/debug query
    // param this page supports (this constant included), so testers don't
    // have to grep the source to remember the ?testWarning= syntax etc.
    // All-lowercase for the same reason as ?raw.
    const DEBUG_PARAM = new URLSearchParams(window.location.search).has('debug');

    // ?export — gated PNG export of the live map (test feature for now).
    // The export button only appears with ?export in the URL.
    const EXPORT_PARAM = new URLSearchParams(window.location.search).has('export');

    function showStateBanner(msg) {
      const el = document.getElementById('state-error-banner');
      el.textContent = msg;
      el.hidden = false;
    }

    // =========================================================
    // Theme toggle — localStorage['theme'] = 'dark'|'light', default
    // light. Same classList convention as root index.html: <html
    // class="light"> is already flipped pre-paint by the <head> script.
    // The basemap tile layer swaps to its dark/light counterpart to match.
    // =========================================================
    function initThemeToggle() {
      document.getElementById('theme-toggle').addEventListener('click', function () {
        const isDark = document.documentElement.classList.toggle('dark');
        document.documentElement.classList.toggle('light', !isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        // Recreate the tile layer from scratch rather than tileLayer.setUrl()
        // — setUrl()'s redraw() reuses the existing layer's internal zoom-level
        // container/transform state, which can end up stale relative to the
        // GeoJSON overlay at a fractional zoom (zoomSnap: 0), rendering the
        // basemap visibly offset until a real zoom/pan forces a recompute. A
        // freshly added layer computes its transform from scratch against the
        // CURRENT map view, so there's nothing stale to inherit.
        if (map && tileLayer) {
          map.removeLayer(tileLayer);
          initTileLayer();
        }
        restyleStateBoundary();
      });
    }

    // =========================================================
    // Location popover — Negeri/Daerah selects tucked behind a pin-icon
    // toggle in the title, anchored via #brand-bar{position:relative}.
    // Only the show/hide chrome lives here; the selects' own change
    // handlers (populateStateSelect/populateDistrictSelect) are unchanged.
    // =========================================================
    function initLocationPopover() {
      const btn = document.getElementById('location-toggle');
      const pop = document.getElementById('location-popover');

      function open() {
        pop.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        document.getElementById('stateSelect').focus();
      }
      function close(opts) {
        const refocus = opts && opts.refocus;
        if (pop.hidden) return;
        pop.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
        if (refocus) btn.focus();
      }

      btn.addEventListener('click', () => pop.hidden ? open() : close());

      document.addEventListener('click', (e) => {
        if (pop.hidden) return;
        // btn.contains(), not e.target !== btn — a click on the icon
        // button's inner <svg>/<path> has THAT as e.target, not the
        // button itself, so a strict !== check closed the popover in
        // the same click that just opened it.
        if (!pop.contains(e.target) && !btn.contains(e.target)) close();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !pop.hidden) close({ refocus: true });
      });

      // Auto-close after a district pick — the map pan + forecast-card
      // update are the visible confirmation. The state select's own change
      // handler navigates the whole page away, so it doesn't need this.
      document.getElementById('districtSelect').addEventListener('change', () => close());
    }

    // =========================================================
    // Nationwide summary bar — plain accordion toggle (not a popover,
    // stays open until clicked again, no outside-click-to-close).
    // Starts expanded each page load, by design — no persistence.
    // =========================================================
    function initNationwideSummaryToggle() {
      const btn = document.getElementById('nationwide-summary-toggle');
      const list = document.getElementById('nationwide-summary-list');
      const chevron = document.getElementById('nationwide-summary-chevron');

      btn.addEventListener('click', () => {
        // Mobile: this button drives the SHARED bottom-sheet footprint
        // (#nationwide-summary-bar's own max-height, see style.css's
        // mobile media query) instead of the desktop-only internal
        // list.hidden accordion below — the two default to OPPOSITE
        // starting states (list.hidden starts false/open for desktop;
        // the shared sheet starts collapsed/peeking for mobile), so
        // reusing list.hidden's toggle here would desync on the very
        // first tap. Leave list.hidden alone (stays visible) on mobile.
        if (isMobileViewport()) {
          const expanded = !document.documentElement.classList.contains('mobile-sheet-expanded');
          setSheetExpanded(expanded);
          btn.setAttribute('aria-expanded', String(expanded));
          chevron.style.transform = expanded ? '' : 'rotate(-90deg)';
          return;
        }
        const collapsed = !list.hidden;
        list.hidden = collapsed;
        btn.setAttribute('aria-expanded', String(!collapsed));
        chevron.style.transform = collapsed ? 'rotate(-90deg)' : '';
      });
    }

    // =========================================================
    // Mobile bottom sheet (<768px) — #side-column and
    // #nationwide-summary-bar are repositioned into one shared bottom-
    // anchored footprint by style.css's mobile media query; only one is
    // ever visible at a time (mode-driven, same mutual exclusion as
    // desktop — see renderCards()/renderNationwidePanel()), so sharing
    // one expand/collapse class on <html> for both is correct, not a
    // compromise. Tap-only (no drag gesture) — deliberately simple, to
    // avoid fighting the map's own touch-pan underneath.
    // =========================================================
    function setSheetExpanded(expanded) {
      document.documentElement.classList.toggle('mobile-sheet-expanded', expanded);
      const handle = document.getElementById('sheet-handle');
      if (handle) {
        handle.setAttribute('aria-expanded', String(expanded));
        const chevron = document.getElementById('sheet-handle-chevron');
        if (chevron) chevron.style.transform = expanded ? 'rotate(-90deg)' : '';
      }
    }

    function initSheetHandle() {
      const handle = document.getElementById('sheet-handle');
      if (!handle) return;
      handle.addEventListener('click', () => {
        setSheetExpanded(!document.documentElement.classList.contains('mobile-sheet-expanded'));
      });
    }

    // Mobile drawer (<768px) — settings + legend colour key behind the
    // hamburger. Open state is a single class on <html> (drives both the
    // drawer slide and the backdrop fade in style.css).
    function setDrawerOpen(open) {
      document.documentElement.classList.toggle('drawer-open', open);
      const btn = document.getElementById('menu-toggle');
      if (btn) btn.setAttribute('aria-expanded', String(open));
    }

    function initMobileDrawer() {
      const btn = document.getElementById('menu-toggle');
      const closeBtn = document.getElementById('drawer-close');
      const backdrop = document.getElementById('drawer-backdrop');
      if (!btn) return;
      btn.addEventListener('click', () => setDrawerOpen(!document.documentElement.classList.contains('drawer-open')));
      if (closeBtn) closeBtn.addEventListener('click', () => setDrawerOpen(false));
      if (backdrop) backdrop.addEventListener('click', () => setDrawerOpen(false));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.documentElement.classList.contains('drawer-open')) setDrawerOpen(false);
      });
    }

    // Single-copy node move: below 768px #theme-toggle, #export-btn and
    // #map-legend live inside the drawer; at/above 768px they go back to
    // their exact original homes (parent + next sibling remembered once
    // at init, before any move). No duplicated markup to drift, and if
    // this ever fails the nodes simply stay where the static HTML put
    // them (desktop layout) — a safe fallback, not a blank drawer.
    function layoutMobileNodes() {
      const mq = window.matchMedia('(max-width: 767px)');
      const slots = new Map([
        ['theme-toggle', 'drawer-theme-slot'],
        ['export-btn', 'drawer-export-slot'],
        ['map-legend', 'drawer-legend-slot'],
      ]);
      const homes = new Map();
      const apply = () => {
        const mobile = mq.matches;
        if (!mobile) setDrawerOpen(false);
        slots.forEach((slotId, elId) => {
          const el = document.getElementById(elId);
          const slot = document.getElementById(slotId);
          if (!el || !slot) return;
          if (!homes.has(el)) homes.set(el, { parent: el.parentNode, next: el.nextSibling });
          if (mobile) {
            if (el.parentNode !== slot) slot.appendChild(el);
          } else {
            const h = homes.get(el);
            if (el.parentNode !== h.parent) h.parent.insertBefore(el, h.next);
          }
        });
      };
      if (mq.addEventListener) mq.addEventListener('change', apply);
      else if (mq.addListener) mq.addListener(apply);
      apply();
    }

    // One-line peek-state summary for single-state mode (#sheet-handle-text).
    // Nationwide mode's own #nationwide-summary-toggle button already reads
    // as a one-line status row (title + count chip + updated-at) and needs
    // no separate summary text.
    function updateSheetHandleText() {
      const textEl = document.getElementById('sheet-handle-text');
      if (!textEl || isNationwide) return;
      if (!focusDistrict) {
        textEl.textContent = `${cfg.displayName} — pilih daerah`;
        return;
      }
      const land = activeWarnings.filter(w => {
        const scope = stateScopeOf(w, cfg).scope;
        return scope && scope !== 'marine';
      });
      if (!land.length) {
        textEl.textContent = `${focusDistrict} — Tiada amaran aktif`;
        return;
      }
      let tier = 'amaran';
      land.forEach(w => {
        const parsed = stateScopeOf(w, cfg);
        if (parsed.tier && TIER_RANK[parsed.tier] > TIER_RANK[tier]) tier = parsed.tier;
        Object.values(parsed.tiers || {}).forEach(t => { if (TIER_RANK[t] > TIER_RANK[tier]) tier = t; });
      });
      textEl.textContent = `${focusDistrict} — ${tierRowLabel(tier)}`;
    }

    // =========================================================
    // Live clock + date
    // =========================================================
    function renderClock() {
      const now = new Date();
      document.getElementById('live-clock').textContent =
        now.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }).replace('PG', 'AM').replace('PTG', 'PM');
      document.getElementById('live-date').textContent =
        now.toLocaleDateString('ms-MY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    // =========================================================
    // ?raw — debug overlay, appended directly to <body> so it always
    // covers the full real viewport regardless of any other layout.
    // Fetches the real endpoints fresh and shows each response's actual
    // text — not the normalized objects fetchActiveWarnings()/
    // fetchRainWarnings() return. The forecast source is only shown when
    // a district is actually resolvable — either already focused, or
    // given via ?district= directly (boot() may call this before the
    // async GeoJSON load has processed that preselect). Nationwide mode
    // has no single district to forecast, so that source is omitted there.
    // =========================================================
    function initRawDebugOverlay() {
      const overlay = document.createElement('div');
      overlay.className = 'raw-debug-overlay';
      overlay.innerHTML = '<h1>Data Mentah API (?raw)</h1>';
      document.body.appendChild(overlay);

      const sources = [
        ['Amaran Ribut Petir (warning)', buildWarningApiUrl(cfg)],
        ['Amaran Hujan Berterusan (rain proxy)', RAIN_PROXY_URL],
      ];

      const districtParam = new URLSearchParams(window.location.search).get('district');
      const forecastDistrict = focusDistrict ||
        (districtParam && cfg.districts.includes(districtParam) ? districtParam : null);
      if (forecastDistrict) {
        sources.unshift([
          `Ramalan Cuaca (forecast) — ${forecastDistrict}`,
          `https://api.data.gov.my/weather/forecast?contains=${encodeURIComponent(forecastDistrict)}@location__location_name`,
        ]);
      } else if (!isNationwide) {
        const note = document.createElement('div');
        note.className = 'raw-debug-note';
        note.textContent = 'Ramalan Cuaca tidak dipaparkan — belum ada daerah dipilih (guna ?district=).';
        overlay.appendChild(note);
      }

      sources.forEach(([label, url]) => {
        const section = document.createElement('section');
        section.className = 'raw-debug-section';
        section.innerHTML = `<h2>${escapeHtml(label)}</h2>` +
          `<div class="raw-debug-url">${escapeHtml(url)}</div>` +
          `<pre class="raw-debug-pre">Memuatkan…</pre>`;
        overlay.appendChild(section);
        const pre = section.querySelector('.raw-debug-pre');

        fetchWithTimeout(url, 8000)
          .then(res => res.text().then(text => ({ ok: res.ok, status: res.status, text })))
          .then(({ ok, status, text }) => {
            let body = text;
            try { body = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* not JSON — show raw text as-is */ }
            pre.textContent = (ok ? '' : `HTTP ${status}\n\n`) + body;
          })
          .catch(err => { pre.textContent = 'Gagal memuatkan: ' + err.message; });
      });
    }

    // Shows both zoom AND center (lat/lng) — not just zoom — so a dev can
    // hand-tune a new state's cfg.center/cfg.zoom pair (see resetMapView():
    // only Pahang has a hand-tuned pair today, every other state still
    // falls back to a bare fitBounds()) the same way "malaysia"'s own
    // cfg.zoom/cfg.center and the 8.63 label threshold were tuned live via
    // this same param.
    function initDebugZoomReadout() {
      const badge = document.createElement('div');
      badge.style.cssText = 'position:fixed;bottom:12px;left:12px;z-index:2000;background:#000;color:#0f0;font:12px monospace;padding:4px 8px;border-radius:4px;white-space:pre;cursor:pointer;';
      badge.title = 'Klik untuk salin';
      document.body.appendChild(badge);

      let copyText = '';
      const update = () => {
        const c = map.getCenter();
        const w = window.innerWidth;
        copyText = `zoom: ${map.getZoom().toFixed(2)}\ncenter: [${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}]`;
        // The MOBILE/DESKTOP line is a display-only hint (resize the
        // window / use devtools' device toolbar to check which side of
        // the 768px breakpoint you're tuning) — not included in the
        // copied text, since it's not meant to be pasted into states.json.
        badge.textContent = `${w < 768 ? 'MOBILE' : 'DESKTOP'} (${w}px)\n${copyText}`;
      };
      map.on('zoom move', update);
      window.addEventListener('resize', update);
      update();

      badge.addEventListener('click', () => {
        navigator.clipboard.writeText(copyText).then(() => {
          const prev = badge.textContent;
          badge.textContent = 'Disalin!';
          setTimeout(() => { badge.textContent = prev; }, 600);
        });
      });
    }

    // Fullscreen (F11) scale-up trigger — toggles .is-fullscreen on <html>,
    // which style.css's own @media (min-width: 768px) block uses to bump
    // the root font-size (scaling every rem-based Tailwind class sitewide)
    // plus a couple of explicit px overrides for the few sizes that aren't
    // rem-based. Same window.innerHeight >= screen.height - 1 heuristic as
    // the ?debugsize=1 readout above — no browser API exists for "is F11
    // fullscreen" directly (the Fullscreen API only covers JS-invoked
    // requestFullscreen(), not the OS-level F11 a viewer actually presses).
    // Deliberately dumb: this only reflects the raw browser signal — the
    // desktop-only gating lives in CSS, matching how the mobile breakpoint
    // is expressed everywhere else in this page (media query, not JS).
    function updateFullscreenClass() {
      document.documentElement.classList.toggle('is-fullscreen', window.innerHeight >= screen.height - 1);
    }

    // Auto-shrinks #side-column when the legend + forecast + warning cards
    // together don't fit the fixed top-4..bottom-4 band (a multi-tier rain
    // bulletin with many district pills is the main trigger, worse again
    // under the fullscreen text bump above). This page runs unattended as
    // physical signage in fullscreen, so anything left below the fold on
    // the old overflow-y-auto would just never be seen by anyone — hence
    // shrinking to fit instead of relying on scroll, with NO minimum scale
    // floor: scroll is explicitly not wanted here, so this always shrinks
    // by exactly however much is needed to fit, however small that gets.
    // #side-column MUST stay overflow: visible (its default Tailwind class,
    // see the HTML) for this to work — overflow: hidden clips content to
    // the box's PRE-transform size, and transform: scale() only shrinks
    // whatever survived that clip, it doesn't pull back in what was
    // already discarded. With overflow: visible, nothing is clipped, so
    // scaling the whole (taller) content by available/needed lands its
    // rendered height at exactly `available`, fitting cleanly with no
    // clip needed at all.
    function fitSideColumnToViewport() {
      const col = document.getElementById('side-column');
      if (!col || isNationwide) return; // nationwide's side-column is legend-only — never tall enough to matter
      const mobile = isMobileViewport();
      // Mobile's #side-column is a collapsed/expanded bottom sheet (style.css's
      // <768px block) — while COLLAPSED (peek state, max-height:48px) it's
      // only ever meant to show #sheet-handle's one-line summary, not a
      // microscopic version of every card, so this must not touch it there.
      // Once EXPANDED (max-height:75vh), though, it has exactly the same
      // "fixed budget, content may exceed it" shape as desktop's top-4..
      // bottom-4 band, so the fit logic below applies there too.
      if (mobile && !document.documentElement.classList.contains('mobile-sheet-expanded')) {
        col.style.transform = '';
        col.style.width = '';
        col.style.maxWidth = '';
        return;
      }
      col.style.transform = '';
      if (!mobile) { col.style.width = ''; col.style.maxWidth = ''; } // mobile's own branch below manages these itself
      // The origin must be the TOP of the box either way — content always
      // flows downward starting from the box's own top edge regardless of
      // whether the box itself is CSS-anchored via top (desktop) or bottom
      // (mobile's sheet). Anchoring there is what makes the shrunk content
      // land flush against BOTH edges of the available budget (scale ×
      // needed = available, starting from a fixed top point) — anchoring
      // at the box's bottom instead would shrink the excess toward that
      // bottom point rather than pulling it up from the top, leaving the
      // result floating mid-sheet instead of reaching the bottom edge.
      // Mobile additionally anchors LEFT, to match fitMobileWidthPreserving()
      // below deliberately over-widening the box before scaling it back down.
      col.style.transformOrigin = mobile ? 'top left' : 'top right';
      // Deferred to a rAF: the Tailwind Play CDN injects the actual CSS for
      // newly-introduced utility classes (e.g. renderWarnCard()'s
      // dynamically-built pill/tier markup) via a MutationObserver, which
      // resolves AFTER the synchronous renderCards()/renderForecast() call
      // that triggered this has already returned. Measuring
      // clientHeight/scrollHeight synchronously here can catch the DOM
      // mid-flight — still at default/unstyled (shorter) sizing for those
      // classes — producing a scale that's too large for the content once
      // Tailwind's styles actually land a moment later, with nothing left
      // to trigger a re-fit against the final size.
      requestAnimationFrame(() => {
        if (mobile) { fitMobileWidthPreserving(col); return; }
        const available = col.clientHeight;
        const needed = col.scrollHeight;
        if (available <= 0 || needed <= available) return;
        col.style.transform = `scale(${available / needed})`;
      });
    }

    // Desktop's plain scale() (fitSideColumnToViewport() above) shrinks
    // width right along with height — fine for desktop's right-anchored
    // floating panel, but mobile's sheet is meant to stay full-width like
    // a native bottom sheet, not shrink into a smaller centered card.
    // Fix: widen the box BEFORE scaling, by exactly the factor the scale
    // will shrink it back by, so the two cancel out and the rendered
    // width still lands at 100% — only the height compresses net overall.
    // Complication: widening the box changes how its content WRAPS (a
    // wider row fits more pills/text before wrapping to a new line), which
    // changes scrollHeight, which changes the ideal scale, which changes
    // how much to widen by — so this converges via a few iterations rather
    // than a single closed-form calculation. Real content (mostly
    // monotonic wrapping as width grows) settles within 2-3 passes.
    function fitMobileWidthPreserving(col) {
      col.style.width = '';
      col.style.maxWidth = '';
      col.style.transform = '';
      const naturalWidth = col.getBoundingClientRect().width; // the CSS width:100% value, unscaled/unwidened
      const available = col.clientHeight;
      const needed = col.scrollHeight;
      if (available <= 0 || needed <= available) return; // fits naturally already — no width/max-width override needed
      // max-width:100% (style.css's <768px block) would otherwise clamp the
      // deliberate over-width right back down to naturalWidth, silently
      // defeating the whole point of widening before scaling.
      col.style.maxWidth = 'none';
      let scale = available / needed;
      for (let i = 0; i < 3; i++) {
        col.style.width = (naturalWidth / scale) + 'px';
        const nextScale = Math.min(1, available / col.scrollHeight);
        if (Math.abs(nextScale - scale) < 0.005) { scale = nextScale; break; }
        scale = nextScale;
      }
      col.style.width = (naturalWidth / scale) + 'px';
      col.style.transform = `scale(${scale})`;
    }

    // Belt-and-suspenders for fitSideColumnToViewport(): rather than relying
    // on every current AND future render path (renderCards(), renderForecast(),
    // an async fetch landing late, etc.) to remember to call it themselves —
    // which already missed a couple of cases in practice — this watches
    // #side-column for ANY actual content change and re-fits automatically.
    // Deliberately NOT observing `attributes` — this function's own
    // style.transform/classList writes are themselves attribute mutations,
    // and including them would retrigger this observer in a pointless (if
    // self-stabilizing) loop on every single fit call.
    function initSideColumnFitObserver() {
      const col = document.getElementById('side-column');
      if (!col) return;
      new MutationObserver(() => fitSideColumnToViewport())
        .observe(col, { childList: true, subtree: true, characterData: true });

      // Mobile's collapsed<->expanded toggle (setSheetExpanded()) animates
      // #side-column's max-height over 0.25s (style.css's <768px block) —
      // that's a pure CSS transition, not a DOM mutation the observer above
      // would ever see, and clientHeight read mid-transition would reflect
      // whatever height the animation happens to be at that instant, not
      // its final 48px/75vh value. Re-fit once the transition actually ends.
      col.addEventListener('transitionend', (e) => {
        if (e.propertyName === 'max-height') fitSideColumnToViewport();
      });
    }

    // ?debugsize=1 — viewport + screen size readout, top-right corner.
    // Standalone (not folded into ?debugzoom=1's badge) since it's useful
    // before the map even loads and doesn't need map.getZoom()/getCenter().
    // Also surfaces screen.height/availHeight and the innerHeight-vs-
    // screen.height comparison used to detect true F11 fullscreen (no
    // dedicated browser API for that — see FULLSCREEN? line below).
    function initDebugSizeReadout() {
      const badge = document.createElement('div');
      // bottom:100px (not the same bottom:12px as ?debugzoom=1's own badge
      // below) — stacked above it so both readouts stay legible if both
      // params are used together, instead of overlapping.
      badge.style.cssText = 'position:fixed;bottom:100px;left:12px;z-index:2000;background:#000;color:#0f0;font:13px monospace;padding:4px 8px;border-radius:4px;white-space:pre;';
      document.body.appendChild(badge);
      const update = () => {
        const isFullscreen = window.innerHeight >= screen.height - 1;
        badge.textContent =
          `inner:  ${window.innerWidth}×${window.innerHeight}\n` +
          `outer:  ${window.outerWidth}×${window.outerHeight}\n` +
          `screen: ${screen.width}×${screen.height} (avail ${screen.availWidth}×${screen.availHeight})\n` +
          `FULLSCREEN? ${isFullscreen ? 'YES' : 'no'}`;
      };
      window.addEventListener('resize', update);
      update();
    }

    // =========================================================
    // ?changelog — renders csr/weather/CHANGELOG.md as-is in the same
    // overlay styling as ?raw (no markdown rendering — plain <pre> text,
    // deliberately, this is a debug-style overlay not a designed page).
    // Fetched fresh with a cache-buster so a just-updated file shows
    // immediately, same convention as the JSON fetches elsewhere.
    // =========================================================
    function initChangelogOverlay() {
      const overlay = document.createElement('div');
      overlay.className = 'raw-debug-overlay';
      overlay.innerHTML = '<h1>Senarai Perubahan (?changelog)</h1>';
      document.body.appendChild(overlay);

      const section = document.createElement('section');
      section.className = 'raw-debug-section';
      section.innerHTML = '<div class="raw-debug-url">/csr/weather/CHANGELOG.md</div>' +
        '<pre class="raw-debug-pre">Memuatkan…</pre>';
      overlay.appendChild(section);
      const pre = section.querySelector('.raw-debug-pre');

      fetchWithTimeout('/csr/weather/CHANGELOG.md?v=' + Date.now(), 8000)
        .then(res => res.text().then(text => ({ ok: res.ok, status: res.status, text })))
        .then(({ ok, status, text }) => {
          pre.textContent = (ok ? '' : `HTTP ${status}\n\n`) + text;
        })
        .catch(err => { pre.textContent = 'Gagal memuatkan: ' + err.message; });
    }

    // =========================================================
    // ?debug — self-documenting overlay listing every test/debug query
    // param this page supports. Static content only (no fetches, unlike
    // ?raw) — reuses .raw-debug-* overlay styling for visual consistency.
    // Keep this list in sync whenever a new ?param is added to the page.
    // =========================================================
    function initDebugOverlay() {

      overlay.className = 'raw-debug-overlay';
      overlay.innerHTML = '<h1>Parameter Ujian/Debug (?debug)</h1>';

          examples: ['?debugzoom=1'],
        },
        {

          desc: 'Papar bacaan window.innerWidth×innerHeight semasa di sudut atas kanan — untuk mengukur saiz viewport sebenar merentasi keadaan chrome pelayar (fullscreen vs maximized, dengan/tanpa bookmarks bar).',
          examples: ['?debugsize=1'],

    // =========================================================
    // Basemap tile layer — CARTO's label-free variants (no place names,
    // no roads emphasis), theme-matched. Sits in Leaflet's default
    // tilePane (zIndex 200), which already paints below the district
    // GeoJSON layer's default overlayPane (400) with no extra pane setup
    // needed. Swapped via .setUrl() on theme toggle rather than the old
    // CSS invert-filter trick — genuinely different tile sets per theme,
    // not just an inverted palette.
    // =========================================================
    function isDarkMode() {
      return document.documentElement.classList.contains('dark');
    }

    // Replaces Leaflet's built-in scrollWheelZoom (disabled in the L.map()
    // options above). That built-in handler moves zoom by an inconsistent
    // amount per notch — raw wheel deltaY ÷ wheelPxPerZoomLevel, and
    // deltaY itself varies wildly across mice/trackpads/OSes — and the fix
    // for that (a nonzero zoomSnap) isn't usable here: zoomSnap rounds
    // EVERY zoom-setting call, including every state's (including
    // "malaysia"'s own) hand-tuned cfg.zoom value, e.g. Pahang's 8.7,
    // onto its grid — silently drifting those off their exact tuned
    // values. So instead: accumulate raw wheel deltaY, and each time it
    // crosses one "notch" worth, step the zoom by exactly 0.2 — leaving
    // zoomSnap: 0 (and every other zoom-setting call) untouched.
    // Wheel input is only ever ACCUMULATED synchronously in the listener —
    // the actual map.setZoomAround() call is batched onto a ~40ms timer
    // (same cadence Leaflet's own built-in handler uses internally). Fast
    // scrolling/trackpads fire many raw wheel events per few ms; committing
    // a zoom change on every single one interrupts the previous CSS zoom
    // transition before it finishes playing, which is what read as jitter.
    // Batching means a fast scroll just accumulates a bigger step and
    // commits it once per tick, so each transition actually gets to play.
    function initStepWheelZoom(map) {
      const STEP = 0.2;
      const NOTCH_PX = 100; // one physical mouse-wheel notch's deltaY (Chrome/Windows default)
      const BATCH_MS = 40;
      let accumPx = 0;
      let lastEvent = null;
      let timer = null;

      const commit = () => {
        timer = null;
        let steps = 0;
        while (Math.abs(accumPx) >= NOTCH_PX) {
          steps += accumPx > 0 ? -1 : 1; // wheel down (deltaY > 0) = zoom out
          accumPx -= NOTCH_PX * Math.sign(accumPx);
        }
        if (!steps) return;
        const current = map.getZoom();
        const target = Math.min(map.getMaxZoom(), Math.max(map.getMinZoom(), Math.round((current + steps * STEP) * 100) / 100));
        if (target !== current) map.setZoomAround(map.mouseEventToContainerPoint(lastEvent), target);
      };

      map.getContainer().addEventListener('wheel', (e) => {
        e.preventDefault();
        accumPx += e.deltaY;
        lastEvent = e;
        if (!timer) timer = setTimeout(commit, BATCH_MS);
      }, { passive: false });
    }

    function tileUrlForTheme() {
      return isDarkMode()
        ? 'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png?key=cb1_2ahu_1_777d1bcc5e262415ab5f6e5b'
        : 'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png?key=cb1_2ahu_1_777d1bcc5e262415ab5f6e5b';
    }

    // NOTE: hostname must be {s}.basemaps.cartocdn.com — an extra ".tile."
    // level breaks TLS (CARTO's wildcard cert covers one subdomain level
    // only), which silently killed the basemap with ERR_CERT_COMMON_NAME_INVALID.
    function initTileLayer() {
      tileLayer = L.tileLayer(tileUrlForTheme(), {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        crossOrigin: true // ?export PNG capture reads tile pixels — needs CORS (CARTO allows it)
      }).addTo(map);
    }

    // =========================================================
    // Map — district layer. Interaction (drag/zoom/scroll) is enabled;
    // a dropdown selection still programmatically pans/zooms via
    // fitBounds()/setView(), same as before.
    // =========================================================
    // Grey (#8a8a8a) borders on every district regardless of warning
    // state — a local override so weather-core.js's shared defaultStyle
    // (also used by paparan/) never gets touched.
    const PAGE_DEFAULT_STYLE = { ...defaultStyle, color: '#8a8a8a' };

    // Nationwide mode draws a separate black state-boundary layer on top
    // (see buildStateBoundaryLayer()) at the CURRENT default thickness, so
    // every individual district border here can go thin — otherwise every
    // internal district line would visually compete with the real state
    // outlines. Single-state mode is untouched (weight 2, as before).
    const NATIONWIDE_DISTRICT_WEIGHT = 1;

    // Overlap paint: rain fill wins (TIER_RANK) with a thick thunder-blue
    // dashed outline on top — both warnings stay visible, no severity lie.
    // Weight is deliberately heavier than the normal district border
    // (2 single-state / 1 nationwide) so the thunder half reads at a glance.
    function overlapStyle(tier, weight) {
      return { ...districtWarningStyle(tier), color: '#2516d2', weight, dashArray: '6 4' };
    }
    function baseStyle(feature) {
      const name = feature.properties.name;

      if (isNationwide) {
        const tier = nationwideDistrictTiers.get(name);
        if (tier && nationwideOverlap.has(name)) return overlapStyle(tier, 3);
        if (tier) return { ...districtWarningStyle(tier), color: '#8a8a8a', weight: NATIONWIDE_DISTRICT_WEIGHT };
        // Vague "whole state, no district detail" wash — scoped to just
        // that state's own features via properties.state, since nationwide
        // mode renders every state at once (unlike single-state mode,
        // where a bare warningScope === 'state' flag was enough because
        // only one state's polygons were ever on screen).
        const wash = nationwideStateWash.get(feature.properties.state);
        if (wash) return { ...stateWarningStyle(wash), color: '#8a8a8a', weight: NATIONWIDE_DISTRICT_WEIGHT };
        return { ...PAGE_DEFAULT_STYLE, weight: NATIONWIDE_DISTRICT_WEIGHT };
      }

      const tier = warningDistricts.get(name);
      // District-specific tier paints on top even under a state-wide wash,
      // so "SEKSYEN A: <State> (Maran)" stays visible inside a vaguer
      // whole-state section from another bulletin.
      if (tier && warningOverlap.has(name)) return overlapStyle(tier, 5);
      if (tier) return { ...districtWarningStyle(tier), color: '#8a8a8a', weight: 2 };
      if (warningScope === 'state') return { ...stateWarningStyle(warningStateTier), color: '#8a8a8a', weight: 2 };
      return PAGE_DEFAULT_STYLE;
    }

    // Dropdown "jump to district" selection — a separate yellow halo layer
    // drawn behind the district's own path, so its real border (grey, or
    // whatever warning colour baseStyle() gave it) stays fully visible on
    // top and only the extra width of the halo peeks out around it.
    const SELECTION_HALO_STYLE = {
      color: '#facc15',
      weight: 8,
      opacity: 1,
      fill: false,
      interactive: false
    };

    let selectionHaloLayer = null;

    function clearSelectionHalo() {
      if (selectionHaloLayer) {
        map.removeLayer(selectionHaloLayer);
        selectionHaloLayer = null;
      }
    }

    function repaintMap() {
      if (!geojsonLayer) return;
      geojsonLayer.setStyle(baseStyle);
      // Overlap districts to the front: their blue border is centred on
      // the polygon boundary, so a later-drawn grey neighbour's fill
      // would otherwise cover its outer half — the border then reads
      // thin on shared edges (seen on Temerloh's southern edge) while
      // looking full-weight on outer edges. Re-applied on every repaint
      // because refreshWarnings() re-runs setStyle on the same layers.
      const overlap = isNationwide ? nationwideOverlap : warningOverlap;
      if (overlap && overlap.size) {
        geojsonLayer.eachLayer(layer => {
          if (overlap.has(layer.feature.properties.name)) layer.bringToFront();
        });
      }
    }

    // Below 768px (matches this repo's own established desktop/mobile
    // breakpoint), states.json's optional per-state cfg.mobile.{zoom,center}
    // take over from the desktop cfg.zoom/cfg.center — hand-tuned the same
    // way (?debugzoom=1), independently, since a phone's portrait aspect
    // ratio needs its own framing. Missing/unset cfg.mobile falls back to
    // the desktop values, so nothing breaks until a state's actually been
    // tuned for mobile.
    function isMobileViewport() {
      return window.innerWidth < 768;
    }

    // District-focus framing per screen tier (see highlightByName()):
    // fitBounds() fits into the whole map container, but floating chrome
    // covers part of it — the 440px side column on desktop, the top bar
    // + expanded bottom sheet on mobile. Per-tier padding reserves that
    // covered space so the district lands fully in the VISIBLE area
    // instead of sliding underneath. The sheet reserve derives from the
    // same 75vh expanded max-height as style.css's mobile block, so the
    // two can't drift apart when one gets tuned.
    function focusFrameOptions() {
      const w = window.innerWidth;
      if (w >= 768) {
        return { paddingTopLeft: [24, 24], paddingBottomRight: [472, 32], maxZoom: 11 };
      }
      const sheetPad = Math.round(window.innerHeight * 0.75) + 24;
      if (w >= 480) {
        return { paddingTopLeft: [24, 88], paddingBottomRight: [24, sheetPad], maxZoom: 10 };
      }
      return { paddingTopLeft: [16, 88], paddingBottomRight: [16, sheetPad], maxZoom: 10 };
    }

    // Large-district escape hatch for mobile (see highlightByName()):
    // the tiered offset framing above reserves the full expanded sheet
    // (75vh), leaving only a thin visible strip — small districts hit the
    // maxZoom cap and render large, centred in that strip, but a big
    // district (Sabah/Sarawak interior) would squeeze into an overview
    // sliver with most of it hidden behind the sheet. Compares the fit
    // zoom into the strip vs the full viewport (both computed live via
    // project(), so real pixels, not guessed degree spans): collapses
    // only when the strip costs both real detail (>1 zoom level) and the
    // strip fit itself is too far out (<8) to read as a focus.
    function districtNeedsFullView(bounds) {
      const w = window.innerWidth;
      if (w >= 768 || !map) return false; // desktop height is fully available — offset framing holds
      const size = map.getSize();
      const sidePad = w >= 480 ? 24 : 16;
      const stripW = size.x - sidePad * 2;
      const stripH = size.y - 88 - (Math.round(window.innerHeight * 0.75) + 24);
      const fullW = size.x - 48;
      const fullH = size.y - 176;
      const z = map.getZoom();
      const p1 = map.project(bounds.getSouthWest(), z);
      const p2 = map.project(bounds.getNorthEast(), z);
      const bw = Math.abs(p2.x - p1.x) || 1;
      const bh = Math.abs(p2.y - p1.y) || 1;
      const zStrip = z + Math.log2(Math.min(stripW / bw, Math.max(stripH, 1) / bh));
      const zFull = z + Math.log2(Math.min(fullW / bw, Math.max(fullH, 1) / bh));
      return zStrip < Math.min(zFull - 1, 8);
    }

    function activeCenter() {
      return (isMobileViewport() && cfg.mobile && cfg.mobile.center) ? cfg.mobile.center : cfg.center;
    }

    function activeZoom() {
      return (isMobileViewport() && cfg.mobile && cfg.mobile.zoom != null) ? cfg.mobile.zoom : cfg.zoom;
    }

    // Resets the map to the active state's own framing — cfg.center/zoom
    // (or their mobile counterparts, see activeCenter()/activeZoom() above),
    // every entry in states.json including "malaysia" itself now carries
    // one, else fitBounds to whatever districts are actually loaded (only
    // reachable for a state whose cfg.zoom/center are still unset).
    function resetMapView() {
      const center = activeCenter(), zoom = activeZoom();
      if (center && zoom != null) {
        map.setView(center, zoom);
      } else if (geojsonLayer) {
        map.fitBounds(geojsonLayer.getBounds());
      }
    }

    // Animated twin of resetMapView() for in-page state switches —
    // Leaflet's flyTo glides out, pans, and glides back in. Boot and
    // prefers-reduced-motion keep the instant setView.
    function flyToStateView() {
      const center = activeCenter(), zoom = activeZoom();
      if (!center || zoom == null) {
        if (geojsonLayer) map.fitBounds(geojsonLayer.getBounds());
        return;
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        map.setView(center, zoom);
        return;
      }
      map.flyTo(center, zoom, { duration: 1.2 });
    }

    // Nationwide-mode district labels — replaces the old always-on
    // per-state pill. Below NATIONWIDE_LABEL_ZOOM_THRESHOLD the map shows
    // no permanent text at all (matches the "general map" screenshot);
    // pointing at a district (hover on desktop, tap on touch) shows just
    // its STATE name on demand. At/above the threshold every district's
    // own tooltip switches to automatic + permanent, reading
    // "District, State" (matches the "zoomed in" screenshot) — no
    // interaction needed once you're zoomed in that far.
    //
    // Hand-tuned via ?debugzoom=1 (same "let them find it, then hardcode
    // it" technique used for Pahang's center/zoom in paparan/).
    const NATIONWIDE_LABEL_ZOOM_THRESHOLD = 8.63;

    const STATE_HOVER_LABEL_CLASS = 'state-hover-pill bg-white/90 dark:bg-zinc-900/90 border border-zinc-200 dark:border-zinc-700 rounded-full px-3.5 py-1 text-sm font-bold font-display text-zinc-900 dark:text-zinc-100 shadow-sm whitespace-nowrap backdrop-blur-sm';
    // Plain outlined text (no pill background) — style.css's own
    // .leaflet-tooltip.district-label-pill rule strips Leaflet's default
    // tooltip chrome and adds the white-fill/black-stroke halo that keeps
    // this legible over either basemap without a dark: variant.
    const DISTRICT_STATE_LABEL_CLASS = 'district-label-pill font-display font-bold text-xs whitespace-nowrap';

    // (pointer: coarse) is the accepted proxy for "primary input is touch"
    // — desktops with a touchscreen but a mouse as primary pointer report
    // fine here, which is what we want (mouse hover already works via
    // Leaflet's own non-permanent-tooltip default, no extra code needed).
    const IS_TOUCH_PRIMARY = window.matchMedia('(pointer: coarse)').matches;

    let nationwideLabelsZoomedIn = false; // mirrors the mode every nationwide layer's tooltip is currently bound in

    function stateDisplayNameForCode(code) {
      const entry = Object.values(STATE_CONFIG).find(s => s.stateCode === code);
      return entry ? entry.displayName : code;
    }

    // Zoomed-out mode for one district layer: state name only, on-demand.
    // Touch has no mouseout to close a hover tooltip, so a tap opens it and
    // a short timer closes it again — desktop just gets Leaflet's default
    // hover show/hide, no extra listener needed.
    function bindNationwideHoverTooltip(layer, feature) {
      layer.bindTooltip(stateDisplayNameForCode(feature.properties.state), {
        permanent: false, direction: 'center', className: STATE_HOVER_LABEL_CLASS
      });
      if (IS_TOUCH_PRIMARY) {
        layer.on('click', () => {
          if (nationwideLabelsZoomedIn) return; // already automatic+permanent, nothing to toggle
          layer.openTooltip();
          setTimeout(() => layer.closeTooltip(), 2500);
        });
      }
    }

    // Re-evaluates every nationwide district layer's tooltip mode against
    // the current zoom. Cheap no-op when the mode hasn't changed (checked
    // once up front) — safe to call from zoomend on every zoom tick.
    function applyNationwideLabelMode() {
      if (!isNationwide || !geojsonLayer) return;
      const zoomedIn = map.getZoom() >= NATIONWIDE_LABEL_ZOOM_THRESHOLD;
      if (zoomedIn === nationwideLabelsZoomedIn) return;
      nationwideLabelsZoomedIn = zoomedIn;

      geojsonLayer.eachLayer(layer => {
        const feature = layer.feature;
        layer.unbindTooltip();
        if (zoomedIn) {
          // "District," on its own line, state name smaller on the line
          // below — Leaflet renders tooltip string content via innerHTML,
          // so a literal <br> plus a wrapping <span> (sized down in
          // style.css) is enough for the line break + size difference.
          layer.bindTooltip(`${feature.properties.name},<br><span class="district-label-state">${stateDisplayNameForCode(feature.properties.state)}</span>`, {
            permanent: true, direction: 'center', className: DISTRICT_STATE_LABEL_CLASS
          }).openTooltip();
        } else {
          bindNationwideHoverTooltip(layer, feature);
        }
      });
    }

    // Black reads fine on the light basemap but disappears against the
    // dark theme's near-black map background (#05070c) — flip to white
    // in dark mode so the state outline stays visible either way.
    function stateBoundaryColor() {
      return document.documentElement.classList.contains('dark') ? '#ffffff' : '#000000';
    }

    // Leaflet's stroke `weight` is a fixed SCREEN-pixel width, not a
    // world-space one — it doesn't scale with zoom the way the polygons
    // themselves do. A flat weight that looks right zoomed into one state
    // reads as disproportionately thick at the nationwide default zoom,
    // where every state is much smaller on screen. Thinner below/at this
    // threshold, normal thickness above it — re-applied live on zoomend.
    const STATE_BOUNDARY_THIN_ZOOM_MAX = 7.8;
    function stateBoundaryWeight() {
      return map.getZoom() <= STATE_BOUNDARY_THIN_ZOOM_MAX ? 1 : 2;
    }

    function restyleStateBoundary() {
      if (stateBoundaryLayer) stateBoundaryLayer.setStyle({ color: stateBoundaryColor(), weight: stateBoundaryWeight() });
    }

    // Single-state label declutter — every district gets a permanent
    // label (buildDistrictLayer()), which is fine for 11 big Pahang
    // districts but piles up in dense states (Sarawak's Kuching/
    // Samarahan cluster, Sabah, Selangor). After every zoom/pan, keep
    // labels Google-style: warned districts outrank quiet ones regardless
    // of size, then biggest area first, ties to the lower screen position
    // (their documented rule); anything overlapping a kept label fades
    // out instead of popping, and reappears on zoom-in as rects separate.
    // The focused district is always kept (REQUIRED). No per-state tuning
    // — real measured pixels, not guessed zooms. Nationwide mode is
    // excluded — it has its own label regime above.
    function declutterDistrictLabels() {
      if (isNationwide || !geojsonLayer || !map) return;
      const areas = new Map();
      geojsonLayer.eachLayer(l => {
        const gb = l.getBounds();
        areas.set(l.feature.properties.name, Math.max((gb.getNorth() - gb.getSouth()) * (gb.getEast() - gb.getWest()), 0));
      });
      const stateWash = warningScope === 'state';
      const items = Array.from(map.getContainer().querySelectorAll('.leaflet-tooltip.district-label-pill'))
        .map(el => ({ el, r: el.getBoundingClientRect(), name: el.textContent.trim() }))
        .map(it => ({ ...it, area: areas.get(it.name) || 0, warned: (stateWash || warningDistricts.has(it.name)) ? 1 : 0 }))
        .filter(it => it.r.width || it.r.height);
      items.sort((a, b) => (b.warned - a.warned) || (b.area - a.area) || (b.r.top - a.r.top));
      const kept = [];
      const overlaps = (a, b, pad) => a.left < b.right + pad && b.left < a.right + pad && a.top < b.bottom + pad && b.top < a.bottom + pad;
      items.forEach(it => {
        const hide = it.name !== focusDistrict && kept.some(k => overlaps(k, it.r, 2));
        it.el.classList.toggle('label-collided', hide);
        if (!hide) kept.push(it.r);
      });
    }

    // Real state-boundary outlines for nationwide mode. Previously derived
    // at runtime from the district polygons via Turf.js (pad every district
    // out a few km, dissolve by state, shrink back — needed because
    // adjacent districts' shared edges in jakim.geojson aren't quite
    // coincident, so a plain dissolve left the seams unmerged). That
    // buffer round-trip isn't lossless: it smooths away anything narrower
    // than the buffer radius, which showed up as a doubled/jagged line on
    // tightly winding river borders (e.g. Terengganu/Perak).
    //
    // The same source repo actually ships a dedicated state-level file —
    // malaysia.state.geojson, 16 features, real traced state boundaries,
    // not derived from the district data at all (confirmed: its per-state
    // bounding boxes match the district file's to within ~10m, so it
    // registers correctly against the district polygons already on the
    // map). Fetching it directly needs zero client-side geometry
    // computation and has no smoothing artifact — dropped the Turf.js
    // dependency entirely since this was its only use in this file.
    const STATE_GEOJSON_URL = 'https://raw.githubusercontent.com/mptwaktusolat/jakim.geojson/refs/heads/master/malaysia.state.geojson';

    function buildStateBoundaryLayer() {
      return fetchWithTimeout(STATE_GEOJSON_URL, 8000)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => L.geoJSON(data, {
          style: { color: stateBoundaryColor(), weight: stateBoundaryWeight(), fill: false, interactive: false },
          interactive: false,
        }))
        .catch(err => {
          console.warn('[weather] State-boundary fetch failed — districts keep their thin grey borders only:', err.message);
          return null;
        });
    }

    // Builds the district polygon layer for a feature list — shared by the
    // boot load and in-page state switches so both paint styles/tooltips
    // identically.
    function buildDistrictLayer(features) {
      return L.geoJSON({ type: 'FeatureCollection', features }, {
        style: baseStyle,
        onEachFeature: (feature, layer) => {
          // Nationwide mode starts every district in the zoomed-out,
          // on-demand "state name only" tooltip mode — applyNationwideLabelMode()
          // (driven by zoomend, plus the explicit call right after
          // resetMapView() below) flips it to automatic per-district
          // labels once the viewer zooms in far enough.
          if (isNationwide) {
            bindNationwideHoverTooltip(layer, feature);
            return;
          }
          layer.bindTooltip(feature.properties.name, {
            permanent: true, direction: 'center',
            className: 'district-label-pill font-display font-bold text-xs whitespace-nowrap'
          });
        }
      });
    }

    function loadGeoJSON() {
      fetchWithTimeout(GEOJSON_URL, 8000)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          fullGeoData = data;
          geojsonLayer = buildDistrictLayer(isNationwide ? data.features : data.features.filter(f => f.properties.state === cfg.stateCode)).addTo(map);

          if (isNationwide) {
            buildStateBoundaryLayer().then(layer => {
              stateBoundaryLayer = layer;
              if (layer) layer.addTo(map);
            });
          }

          // The tile layer is created here — deliberately NOT eagerly at
          // boot(), before this state's real view is known. resetMapView()
          // can jump the zoom several levels in one step for any
          // auto-fitBounds() state (no hand-tuned cfg.center/cfg.zoom) — e.g.
          // Negeri Sembilan's provisional zoom (6.4, the boot()-time safety
          // fallback) to its own tight fitBounds() zoom (~10.45), or worse for a small
          // single-district state like Kuala Lumpur. Confirmed live: a tile
          // layer created at that provisional zoom and then corrected via
          // map.removeLayer()+initTileLayer() shortly after can leave stale
          // tiles/levels behind — either the old zoom's container stuck at
          // opacity:1 (a pale, ~11x-scaled band across the map), or, once
          // deferred to 'moveend' to dodge THAT race, a live-network-only gap
          // while the freshly-recreated layer's tiles reload from scratch.
