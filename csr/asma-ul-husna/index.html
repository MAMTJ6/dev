<!DOCTYPE html>
<html lang="ms" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asma-ul-Husna | MAMTJ6</title>
    <meta name="description" content="99 Nama Allah (Asma-ul-Husna) — satu nama dipaparkan setiap hari, bergilir sepanjang 99 hari.">
    <link rel="icon" type="image/svg+xml" href="/media/logo-mamtj6/SVG/mamtj6_single.svg">

    <!-- Google Fonts: Inter + Noto Naskh Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        arabic: ['Noto Naskh Arabic', 'serif'],
                    },
                },
            },
        }
    </script>

    <!-- Elak kelipan (flash) semasa muat halaman -->
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.replace('light', 'dark');
            }
        })();
    </script>
</head>

<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-950 dark:text-zinc-50 font-sans antialiased transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 py-8 sm:px-6">

        <!-- Butang Tema -->
        <div class="flex justify-between items-center mb-4">
            <a href="/" class="text-sm text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 transition-colors">&larr; Laman Utama</a>
            <button id="theme-toggle"
                class="inline-flex items-center justify-center rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-2 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition-colors"
                aria-label="Tukar tema">
                <svg id="icon-sun" class="hidden dark:block h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                </svg>
                <svg id="icon-moon" class="block dark:hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                </svg>
            </button>
        </div>

        <!-- Logo -->
        <div class="flex justify-center mb-4">
            <img src="/media/logo-mamtj6/SVG/mamtj6-black_text.svg" alt="Logo MAMTJ6" class="h-16 w-auto block dark:hidden">
            <img src="/media/logo-mamtj6/SVG/mamtj6-white.svg" alt="Logo MAMTJ6" class="h-16 w-auto hidden dark:block">
        </div>

        <!-- Tajuk -->
        <div class="text-center mb-8">
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100 uppercase">
                Asma-ul-Husna
            </h1>
            <p class="text-sm sm:text-base text-zinc-500 dark:text-zinc-400 mt-1">
                99 Nama Allah — satu nama dipaparkan setiap hari, bergilir sepanjang 99 hari
            </p>
        </div>

        <!-- Kad Hari Ini -->
        <div id="today-card" class="mb-8 rounded-2xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-6 sm:p-8 text-center">
            <p class="text-zinc-400">Memuatkan...</p>
        </div>

        <!-- Grid Nama -->
        <div id="name-grid" dir="rtl" class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-7 lg:grid-cols-9 gap-2 sm:gap-3">
            <p class="col-span-full text-center text-zinc-400 py-10">Memuatkan...</p>
        </div>
    </div>

    <!-- Popup -->
    <div id="modal-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div id="modal-panel" class="relative w-full max-w-md max-h-[85vh] overflow-y-auto rounded-2xl bg-white dark:bg-zinc-900 shadow-2xl p-6 sm:p-8 text-center">
            <button id="modal-close" aria-label="Tutup"
                class="absolute top-3 right-3 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition-colors">
                <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>

            <span id="modal-badge" class="inline-block mb-3 rounded-full px-3 py-1 text-xs font-semibold"></span>

            <img id="modal-svg" src="" alt="" class="w-32 h-32 sm:w-40 sm:h-40 mx-auto mb-4">

            <div id="modal-index" class="text-xs text-zinc-400 mb-1"></div>
            <h2 id="modal-latin" class="text-2xl font-bold text-zinc-900 dark:text-zinc-100 mb-1"></h2>
            <p id="modal-meaning" class="text-base font-semibold text-emerald-700 dark:text-emerald-400 mb-4"></p>
            <p id="modal-explanation" class="text-sm text-zinc-600 dark:text-zinc-400 text-left leading-relaxed"></p>
        </div>
    </div>

    <script src="/csr/asma-ul-husna/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const grid = document.getElementById('name-grid');
            const overlay = document.getElementById('modal-overlay');
            const closeBtn = document.getElementById('modal-close');
            const themeToggle = document.getElementById('theme-toggle');

            themeToggle.addEventListener('click', function () {
                const isDark = document.documentElement.classList.toggle('dark');
                document.documentElement.classList.toggle('light', !isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            let names = [];
            let todayIndex0 = 0;

            asmaLoadNames()
                .then(function (result) {
                    names = result.names;
                    todayIndex0 = result.todayIndex0;
                    renderGrid();
                    renderTodayCard(asmaIndexFromURL(todayIndex0));
                })
                .catch(function (err) {
                    grid.innerHTML = '<p class="col-span-full text-center text-red-500 py-10">' + err.message + '</p>';
                    document.getElementById('today-card').innerHTML = '<p class="text-red-500">' + err.message + '</p>';
                });

            function renderTodayCard(index0) {
                const entry = names[index0];
                const card = document.getElementById('today-card');
                if (!entry) return;

                const isPreview = index0 !== todayIndex0;

                card.innerHTML =
                    '<span class="inline-block mb-4 rounded-full px-3 py-1 text-xs font-semibold ' +
                    (isPreview ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300') + '">' +
                    (isPreview ? 'Previewing Hari ' + entry.index : 'Asma-ul-Husna Hari Ini:') +
                    '</span>' +
                    '<img src="' + ASMA_SVG_BASE + entry.svg + '" alt="' + entry.latin + '" class="w-32 h-32 sm:w-40 sm:h-40 mx-auto mb-4">' +
                    '<div class="text-xs text-zinc-400 mb-1">Nama ke-' + entry.index + ' daripada 99</div>' +
                    '<h2 class="text-2xl sm:text-3xl font-bold text-zinc-900 dark:text-zinc-100 mb-1">' + entry.latin + '</h2>' +
                    '<p class="text-base sm:text-lg font-semibold text-emerald-700 dark:text-emerald-400 mb-4">' + entry.shortMeaning + '</p>' +
                    '<p class="text-sm text-zinc-600 dark:text-zinc-400 max-w-2xl mx-auto leading-relaxed">' + entry.explanation + '</p>';
            }

            function renderGrid() {
                grid.innerHTML = names.map(function (n, i) {
                    return '<button type="button" dir="ltr" data-index="' + i + '" class="name-card rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 p-2 hover:shadow-md hover:-translate-y-0.5 transition text-center">' +
                        '<span class="block text-[10px] text-zinc-400">' + n.index + '</span>' +
                        '<img src="' + ASMA_SVG_BASE + n.svg + '" alt="' + n.latin + '" class="w-full h-14 sm:h-16 object-contain my-1">' +
                        '<span class="block text-[11px] sm:text-xs font-medium text-zinc-700 dark:text-zinc-300 truncate">' + n.latin + '</span>' +
                        '</button>';
                }).join('');

                grid.querySelectorAll('.name-card').forEach(function (card) {
                    card.addEventListener('click', function () {
                        openPopup(parseInt(card.dataset.index, 10), true);
                    });
                });
            }

            function openPopup(index0, updateUrl) {
                const entry = names[index0];
                if (!entry) return;

                const isPreview = index0 !== todayIndex0;

                const badge = document.getElementById('modal-badge');
                badge.textContent = isPreview ? ('Previewing Hari ' + entry.index) : 'Hari Ini';
                badge.className = 'inline-block mb-3 rounded-full px-3 py-1 text-xs font-semibold ' +
                    (isPreview
                        ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300'
                        : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300');

                document.getElementById('modal-svg').src = ASMA_SVG_BASE + entry.svg;
                document.getElementById('modal-svg').alt = entry.latin;
                document.getElementById('modal-index').textContent = 'Nama ke-' + entry.index + ' daripada 99';
                document.getElementById('modal-latin').textContent = entry.latin;
                document.getElementById('modal-meaning').textContent = entry.shortMeaning;
                document.getElementById('modal-explanation').textContent = entry.explanation;

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                document.body.classList.add('overflow-hidden');

                if (updateUrl) {
                    const url = new URL(window.location.href);
                    url.search = '';
                    url.searchParams.set('day', entry.index);
                    history.replaceState(null, '', url);
                }
            }

            function closePopup() {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                document.body.classList.remove('overflow-hidden');
                const url = new URL(window.location.href);
                url.search = '';
                history.replaceState(null, '', url);
            }

            closeBtn.addEventListener('click', closePopup);
            overlay.addEventListener('click', function (e) { if (e.target === overlay) closePopup(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePopup(); });
        });
    </script>
</body>

</html>
