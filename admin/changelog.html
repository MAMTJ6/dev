<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sejarah Perubahan — Admin MAMTJ6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="sidebar-mobile-topbar">
  <button class="sidebar-toggle-btn" onclick="toggleNav()" aria-label="Menu">&#9776;</button>
  <span>Admin MAMTJ6</span>
</div>
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeNav()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">Admin MAMTJ6</div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-footer">
    <button class="sidebar-logout-btn" onclick="signOut()">Log Keluar</button>
  </div>
</aside>

<div class="admin-content">
<div class="page">
  <div class="section-header">
    <h1 class="section-title">Sejarah Perubahan</h1>
  </div>

  <p class="page-hint">
    Ringkasan perubahan sistem dalam Bahasa Melayu — klik <strong>Butiran teknikal</strong>
    untuk nota pembangun. Jejak audit penuh (siapa, bila, apa):
    <a href="/admin/userlog.html">Log Aktiviti</a>.
  </p>

  <div class="filter-bar">
    <div class="form-group">
      <label for="filter-module">Modul</label>
      <select id="filter-module" onchange="applyChangelogFilter()">
        <option value="">Semua Modul</option>
      </select>
    </div>
    <div class="form-group filter-actions">
      <button class="btn btn-ghost btn-sm" onclick="resetChangelogFilter()">Reset</button>
    </div>
  </div>

  <div id="changelog-list">
    <div class="card" style="padding:1rem 1.25rem"><p class="state-cell">Memuatkan...</p></div>
  </div>
</div>
</div>

<script src="/admin/app.js"></script>
<script src="/admin/changelog.js"></script>
</body>
</html>
