<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalendar — Admin MAMTJ6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>

  <div class="sidebar-mobile-topbar">
    <button class="sidebar-toggle-btn" onclick="toggleNav()" aria-label="Menu">&#9776;</button>
    <span>Admin MAMTJ6</span>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeNav()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Admin MAMTJ6</div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <button class="sidebar-logout-btn" onclick="signOut()">Log Keluar</button>
    </div>
  </aside>

  <div class="admin-content">
  <div class="page">
    <div class="section-header">
      <h1 class="section-title">Tarikh Penting Islam</h1>
      <div style="display:flex;gap:0.5rem">
        <a class="btn btn-ghost" href="/calendar/hijri/tarikh-penting/index.html" target="_blank" rel="noopener">Lihat Paparan</a>
        <button class="btn btn-primary" id="publish-calendar-btn" onclick="onSavePublish()">Simpan &amp; Terbitkan</button>
      </div>
    </div>

    <p class="page-hint" id="last-published-note">Memuatkan...</p>
    <p class="page-hint">
      Rujukan rasmi:
      <a href="https://www.e-solat.gov.my/index.php?siteId=24&pageId=52" target="_blank" rel="noopener">e-Solat JAKIM</a>.
      Data ditulis ke <code>calendar/hijri/data/events.json</code>.
    </p>

    <div class="card" id="calendar-next-card" style="padding:1.25rem;margin-bottom:0.75rem;display:none">
      <span class="news-status-badge news-status-active" style="margin-bottom:0.5rem">Peristiwa Terdekat</span>
      <h3 style="margin:0 0 0.25rem;font-size:1.125rem" id="calendar-next-name">—</h3>
      <p style="margin:0 0 0.5rem;font-size:0.875rem;color:var(--text-muted)" id="calendar-next-date"></p>
      <span id="calendar-next-countdown"></span>
    </div>

    <div class="card">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Nama Peristiwa</th>
            <th>Tarikh Hijrah</th>
            <th>Tarikh Masihi</th>
            <th>Kira Detik</th>
            <th style="width:110px">Tindakan</th>
          </tr>
        </thead>
        <tbody id="calendar-tbody">
          <tr><td colspan="6" class="state-cell">Memuatkan...</td></tr>
        </tbody>
      </table>
    </div>

    <div style="margin-top:0.75rem">
      <button class="btn btn-ghost btn-sm" id="add-event-btn" onclick="addRow()">+ Tambah Acara</button>
    </div>

    <!-- ── Add / Edit modal ── -->
    <div class="modal-overlay" id="calendar-modal" onclick="handleCalendarOverlay(event)">
      <div class="modal" style="max-width:480px">
        <div class="modal-header">
          <span class="modal-title" id="calendar-modal-title">Tambah Acara</span>
          <button class="modal-close" onclick="closeCalendarModal()">&times;</button>
        </div>
        <input type="hidden" id="edit-index" value="">
        <div class="form-group">
          <label for="edit-name">Nama Peristiwa</label>
          <input type="text" id="edit-name" placeholder="Cth: Awal Ramadan">
        </div>
        <div class="form-group">
          <label for="edit-hijri">Tarikh Hijrah</label>
          <input type="text" id="edit-hijri" placeholder="Cth: 1 Ramadan 1447 H">
        </div>
        <div class="form-group">
          <label for="edit-date">Tarikh Masihi</label>
          <input type="date" id="edit-date">
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeCalendarModal()">Batal</button>
          <button class="btn btn-primary" onclick="saveRow()">Simpan</button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script src="/admin/app.js"></script>
  <script src="/admin/kuliah/kuliah-api.js"></script>
  <script src="/admin/calendar/calendar-common.js"></script>
  <script src="/admin/calendar/senarai.js"></script>
</body>
</html>
