<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk Staf — MAMTJ6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/staff/style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="login-card">
        <img src="/media/logo-mamtj6/SVG/mamtj6_single.svg" class="login-logo" alt="" onerror="this.style.display='none'">
        <h1>Log Masuk Staf</h1>
        <p class="login-subtitle">Masjid Al-Mukhlisin, Taman Jaya 6</p>

        <div id="step-name" class="login-step">
            <div class="form-group">
                <label for="staff-select">Nama Anda</label>
                <select id="staff-select">
                    <option value="">Memuatkan senarai staf...</option>
                </select>
            </div>
            <div class="form-group" id="pin-group" style="display:none">
                <label for="pin-input">PIN (6 digit)</label>
                <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••">
            </div>
            <button type="button" class="btn btn-primary" id="pin-submit-btn" style="display:none" onclick="submitPinLogin()">Log Masuk</button>

            <div class="login-divider"><span>ATAU</span></div>

            <div id="g-signin-btn" class="g-signin-btn"></div>
        </div>

        <div id="step-success" class="login-step" style="display:none">
            <div class="success-icon">&#10003;</div>
            <p class="success-name" id="success-name"></p>
            <p class="success-note">Log Masuk Berjaya</p>
        </div>

        <p id="login-error" class="login-error" style="display:none"></p>
    </div>

    <script src="/staff/script.js"></script>
</body>
</html>
